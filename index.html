<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>시험에 다나와</title>
<style>
/* 화면(교사 작업 화면) 토큰 */
:root{
  --font:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Nanum Gothic',sans-serif;
  --bg:#ebe9e5; --panel:#fcfbf9; --ink:#1f2430; --muted:#5b6170; --line:#d2cec7;
  --accent:#b23c0b; --accent-ink:#ffffff; --accent-soft:#f8e4d8;
  --warn:#8a4700; --danger:#a12a2a; --field:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17181b; --panel:#202226; --ink:#e9e7e3; --muted:#a8a49c; --line:#3a3c41;
  --accent:#f0915e; --accent-ink:#1b0e06; --accent-soft:#3b2a20; --warn:#f1b768; --danger:#f19090; --field:#18191c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#17181b; --panel:#202226; --ink:#e9e7e3; --muted:#a8a49c; --line:#3a3c41;
  --accent:#f0915e; --accent-ink:#1b0e06; --accent-soft:#3b2a20; --warn:#f1b768; --danger:#f19090; --field:#18191c; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.5;background:var(--bg);color:var(--ink);word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{font-weight:700;font-size:17px;margin-right:6px;white-space:nowrap;letter-spacing:-.01em}
.brand em{font-style:normal;color:var(--accent)}
.unit-pick{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.unit-pick select{max-width:min(320px,70vw)}
.spacer{flex:1}
.save-state{font-size:12.5px;color:var(--muted);white-space:nowrap}
.save-state.fail{color:var(--warn)}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 16px 10px;border-bottom:3px solid transparent;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .st{font-weight:400;font-size:12px;margin-left:5px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--danger)}
.btn.small{padding:3px 8px;font-size:12.5px}
select,input[type="text"]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--field)}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,460px) minmax(0,1fr)}
.editor{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.preview{overflow:auto;min-width:0;display:flex;flex-direction:column}
@media (max-width:980px){
  .app{height:auto}
  .work{grid-template-columns:minmax(0,1fr)}
  .editor{border-right:0;border-bottom:1px solid var(--line);overflow:visible;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .preview{overflow:visible}
}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label,.lbl{font-weight:700;font-size:13px}
.fld textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 9px;background:var(--field);line-height:1.55;resize:vertical;font-size:13px}
.fld input[type="text"],.fld select{width:100%}
.help{margin:0;font-size:12px;color:var(--muted)}
.live{margin:0;font-size:12px}
.live .ok{color:var(--muted)}
.live .warn{color:var(--warn);display:block}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 10px}
details.box{border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:13px;margin-bottom:12px;background:var(--panel)}
details.box summary{cursor:pointer;font-weight:700}
details.box[open] summary{margin-bottom:8px}
.rules table{border-collapse:collapse;width:100%}
.rules td{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top}
.rules code,.help code{font-family:var(--font);background:var(--accent-soft);padding:0 4px;border-radius:3px;font-weight:700;white-space:nowrap}
.check-row{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:7px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.check-row input{margin-top:3px;width:18px;height:18px;flex:none}
.check-row.done{background:transparent;border:1px solid var(--line)}
.sec-title{font-size:15px;margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;background:var(--panel)}
.card .card{background:transparent;border-style:dashed}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.card-h h3,.card-h h4{margin:0;font-size:14px}
.card-act{display:flex;gap:4px;flex-wrap:wrap}
.empty-cards{font-size:13px;color:var(--muted);margin:0 0 10px}
.empty-state{border:1px dashed var(--line);border-radius:10px;padding:22px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty-state h2{margin:0;font-size:17px}
.empty-state p{margin:0;color:var(--muted)}
.pv-bar{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:6px 12px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+label{outline:3px solid var(--accent);outline-offset:-3px}
.ctl{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.pages-info{font-size:13px;font-weight:700}
.pages-info.warn{color:var(--warn)}
.pv-opts{padding:0 16px}
.pv-opts details{background:var(--panel);border:1px solid var(--line);border-radius:7px;margin-top:10px;padding:8px 12px;font-size:13px}
.pv-opts summary{cursor:pointer;font-weight:700}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin-top:10px}
.opt-note{margin:8px 0 0;color:var(--muted);font-size:12.5px}
.print-tip{margin:8px 16px 0;font-size:12.5px;color:var(--muted)}
.pv-msg{margin:8px 16px 0;font-size:13px}
.pv-msg:empty{display:none}
.pages{padding:16px;display:flex;flex-direction:column;align-items:center;gap:18px}
.pv-fig{margin:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:100%}
.pv-fig figcaption{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:center}
.pv-draft{background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:1px 7px;font-weight:700}
.pv-frame{position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18),0 6px 18px rgba(0,0,0,.10);max-width:100%}
.pv-scale{transform-origin:0 0;position:absolute;left:0;top:0}
.pv-empty{position:absolute;inset:auto 0 42% 0;text-align:center;color:#666;font-size:13pt;padding:0 10%}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:20;max-width:calc(100vw - 32px);font-size:13.5px}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:5px;padding:3px 9px;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:18px 20px;max-width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 12px;font-size:17px}
dialog fieldset{border:1px solid var(--line);border-radius:7px;margin:0 0 10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 16px}
dialog legend{font-weight:700;font-size:13px;padding:0 4px}
.dlg-act{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#measure{position:absolute;left:-30000px;top:0;visibility:hidden;pointer-events:none}
#print-root{display:none}

/* ===== 종이(A4, 컬러 인쇄) — 화면 테마와 상관없이 같은 색 ===== */
.sheet{
  --p-ink:#1f2430; --p-brand:#b23c0b; --p-brand-soft:#fbe9df; --p-mark:#ffe97a; --p-pen:#1f47b5; --p-box:#f3f1ec; --p-line:#d8d4cc;
  --r-S:#d6e4ff; --r-V:#ffd6dc; --r-O:#d3f0dc; --r-C:#ffe9b8; --r-X:#e6defc;
  font-family:var(--font);font-size:var(--fs,10pt);line-height:1.55;color:var(--p-ink);word-break:keep-all;overflow-wrap:break-word;text-wrap:pretty;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet *{box-sizing:border-box}
.page{width:210mm;height:297mm;padding:11mm 12mm 12mm;background:#fff;position:relative;overflow:hidden}
.blk{display:flow-root}
.row-cols{display:grid;grid-template-columns:minmax(0,1fr);}
.row-cols.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:6mm}
.pfoot{position:absolute;left:12mm;right:12mm;bottom:5.5mm;font-size:7pt;color:#666;display:flex;justify-content:space-between}

/* 머리 */
.ph-wrap{padding-bottom:2.6mm}
.ph-top{display:flex;justify-content:space-between;gap:4mm;align-items:baseline;font-size:.8em;color:#4a4f5c;border-bottom:.3mm solid var(--p-ink);padding-bottom:.8mm}
.ph-top b{color:var(--p-ink)}
.ph-left{display:flex;align-items:baseline;gap:2mm;min-width:0}
.ph-hd{font-weight:700;color:var(--p-ink);white-space:nowrap;padding-right:2mm;border-right:.3mm solid #b9b5ad;letter-spacing:.01em}
.ph-brand{font-weight:700;color:var(--p-ink);white-space:nowrap;padding-right:2mm;border-right:.3mm solid #b9b5ad;letter-spacing:-.01em}
.ph-brand em,.pfoot em{font-style:normal;color:var(--p-brand)}
.pfoot b{color:#333}
.ph-main{display:flex;justify-content:space-between;align-items:flex-end;gap:4mm;padding-top:1.6mm}
.ph-page{display:flex;align-items:baseline;gap:2.5mm;line-height:1.1}
.ph-en{font-size:2.15em;font-weight:700;letter-spacing:.03em;color:var(--p-brand)}
.ph-ko{font-size:1.15em;font-weight:700}
.ph-side{display:flex;align-items:center;gap:3mm;font-size:.86em;white-space:nowrap}
.ph-tag{background:var(--p-ink);color:#fff;border-radius:1mm;padding:.3mm 2mm;font-weight:700}
.ph-name span{display:inline-block;width:28mm;border-bottom:.25mm solid var(--p-ink);margin-left:1.5mm}
.ph-instr{margin-top:1.8mm;font-size:.8em;background:var(--p-box);border-radius:1mm;padding:.9mm 2.5mm;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5mm 4mm}
.ph-legend{display:inline-flex;gap:1.2mm;align-items:center}
.ph-cont{font-size:.8em;color:#4a4f5c;padding-bottom:1.2mm;border-bottom:.3mm solid var(--p-ink);margin-bottom:2.4mm;display:flex;justify-content:space-between}

/* 공통 글자 표시 */
.ko{font-size:.86em;color:#4d4f55}
.key{background:var(--p-mark);border-radius:.5mm;padding:0 .3mm;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.bn{text-indent:0;display:inline-block;font-size:.6em;color:var(--p-brand);font-weight:700;margin-right:.15em;transform:translateY(-.55em);line-height:1}
.blank{white-space:nowrap}
.ul{text-indent:0;max-width:calc(100% - 3em);display:inline-block;border-bottom:.25mm solid var(--p-ink);height:1em;vertical-align:-.15em}
.nw{white-space:nowrap}
.an-t{text-decoration:underline;text-decoration-color:var(--p-pen);text-decoration-thickness:.22mm;text-underline-offset:.55mm}
.an-sp{display:inline-block;position:relative;width:0;height:0;vertical-align:top;text-indent:0}
.an-n{position:absolute;left:0;top:1.4em;white-space:nowrap;font-size:.62em;line-height:1.25;color:var(--p-pen);font-weight:400;text-indent:0;text-decoration:none}
.an.role{display:inline-block;position:relative;text-indent:0}
.an.role .an-t{text-decoration:none}
.an-n.lab{color:#555}
.role{border-radius:.8mm;padding:0 .5mm;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.r-S{background:var(--r-S)} .r-V{background:var(--r-V)} .r-O{background:var(--r-O)} .r-C{background:var(--r-C)} .r-X{background:var(--r-X)}
.tr{font-size:.84em;color:#5a5d66;line-height:1.4}
.tr.write{border-bottom:.2mm solid #999;height:6mm}
.gloss{font-size:.84em;color:#5a5d66;margin-left:.5em}
.bank{border:.25mm dashed #7a7a7a;border-radius:1mm;padding:.5mm 2mm;margin:1mm 0 .3mm;font-size:.82em;line-height:1.5;background:#fff}
.bank b{margin-right:1.5mm;color:var(--p-brand)}
.bank .sep{color:#888;margin:0 1.2mm}
.star{color:var(--p-brand);font-weight:700;margin-right:.2em}
.v-blank .lh-x:has(.blank){line-height:1.8}

/* 소제목 */
.sec-h{display:flex;align-items:center;gap:1.8mm;font-weight:700;color:var(--p-brand);border-bottom:.45mm solid var(--p-brand);padding:2.6mm 0 .5mm;margin-bottom:.8mm;font-size:1.02em}
.sec-h .ic{display:inline-flex;align-items:center;justify-content:center;width:4.2mm;height:4.2mm;border-radius:.8mm;background:var(--p-brand);color:#fff;font-size:.72em}

/* 단어 */
.vl{padding:.35mm 0 .35mm 3mm;text-indent:-3mm}
.vl::before{content:"·";display:inline-block;width:3mm;text-indent:0;color:var(--p-brand);font-weight:700}
.vsub{font-weight:700;font-size:.9em;padding:1.4mm 0 .3mm;border-bottom:.2mm solid #b9b5ad;margin-bottom:.5mm}
.def{display:grid;grid-template-columns:24% 44% minmax(0,1fr);gap:0 2.5mm;padding:.7mm 0;border-bottom:.15mm solid #e0ddd6;font-size:.94em;align-items:baseline}
.def-k{font-size:.86em;color:#5a5d66}

/* 대화문 */
.fn{border:.3mm solid var(--p-line);border-radius:1.6mm;overflow:hidden;margin-bottom:2.4mm}
.fn-h{background:var(--p-brand-soft);padding:1mm 2.6mm;font-weight:700;display:flex;gap:1.6mm;align-items:baseline}
.fn-h .no{color:var(--p-brand)}
.fn-b{padding:1.2mm 2.6mm 1.6mm}
.fn-model{background:var(--p-box);border-radius:1mm;padding:1mm 2.2mm;margin-bottom:1.2mm}
.fn-ml{display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:0 1mm}
.fn-ml .tr{grid-column:2}
.fn-g{font-weight:700;font-size:.84em;color:#444;padding-top:.8mm}
.fn-l{padding-left:2.6mm;text-indent:-2.6mm}
.fn-l::before{content:"·";display:inline-block;width:2.6mm;text-indent:0;color:var(--p-brand);font-weight:700}
.fn-note{font-size:.82em;color:var(--p-pen);padding-top:.8mm}
.dl-h{display:flex;flex-direction:column;gap:.6mm;padding-top:1.8mm}
.dl-tab{align-self:flex-start;background:var(--p-ink);color:#fff;font-weight:700;border-radius:1mm;padding:.3mm 2.4mm;font-size:.9em}
.dl-sit{background:var(--p-brand-soft);border-radius:1mm;padding:.8mm 2.2mm;font-size:.84em}
.dl-line{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:0 1.2mm;padding:.25mm 0;align-items:baseline}
.dl-sp{font-weight:700;color:#555}
.pt{display:grid;grid-template-columns:42% minmax(0,1fr);gap:0 3mm;padding:.8mm 0;border-bottom:.15mm solid #e0ddd6;font-size:.94em;align-items:baseline}
.pt-b{font-size:.92em}

/* 문법 */
.g-band{background:var(--p-brand);color:#fff;border-radius:1.4mm;padding:1.6mm 3mm;margin-top:1.6mm;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.4mm 3mm;align-items:baseline}
.g-badge{background:#fff;color:var(--p-brand);border-radius:.8mm;padding:0 1.6mm;font-weight:700;font-size:.8em}
.g-title{font-weight:700;font-size:1.15em}
.g-rep{grid-column:1/-1;background:#fff;color:var(--p-ink);border-radius:1mm;padding:1mm 2.4mm;margin-top:.8mm}
.g-rep .tag{font-size:.72em;color:var(--p-brand);font-weight:700;margin-right:1.5mm}
.g-part{padding-top:2mm}
.g-pt{font-weight:700;display:flex;gap:1.4mm;align-items:baseline;margin-bottom:.6mm}
.g-pt .no{color:#fff;background:var(--p-ink);border-radius:50%;width:4.2mm;height:4.2mm;display:inline-flex;align-items:center;justify-content:center;font-size:.74em;flex:none;transform:translateY(-.2mm)}
.g-p{margin:.3mm 0}
.fx{display:flex;flex-wrap:wrap;align-items:center;gap:1mm;margin:1.2mm 0}
.fx-i{border:.3mm solid #8d8a83;border-radius:1mm;padding:.3mm 1.8mm;font-weight:700;font-size:.9em;background:#fff}
.fx-p{font-weight:700;color:#8d8a83}
.ex-box{background:var(--p-box);border-radius:1.4mm;padding:1.2mm 2.4mm;margin:1.2mm 0}
.ex{padding:.3mm 0}
.g-note{font-size:.88em;color:var(--p-pen);padding:.3mm 0 .3mm 3mm;text-indent:-3mm}

/* 본문 */
.r-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:1mm 3mm;padding:.5mm 0 1mm}
.r-title b{font-size:1.25em}
.r-sec{display:flex;align-items:baseline;gap:2mm;padding:2mm 0 .5mm;border-bottom:.35mm solid var(--p-ink);font-weight:700}
.r-sec .no{background:var(--p-brand);color:#fff;border-radius:.8mm;padding:0 1.6mm;font-size:.8em}
.sent{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:0 1.6mm;padding:.7mm 0 .6mm;border-bottom:.15mm solid #e6e3dc;align-items:baseline}
.s-no{font-weight:700;color:var(--p-brand);text-align:right;font-variant-numeric:tabular-nums}
.sent.is-star .en{font-weight:400}
.flow table{width:100%;border-collapse:collapse;font-size:.86em;line-height:1.45}
.flow th{background:var(--p-ink);color:#fff;font-weight:700;padding:.8mm 1.6mm;text-align:left}
.flow td{border:.2mm solid #cfcac1;padding:.9mm 1.6mm;vertical-align:top}
.flow td:first-child{font-weight:700;white-space:nowrap}
.v-blank .flow td{line-height:2}

@page{size:A4 portrait;margin:0}
@media print{
  html,body{height:auto;background:#fff!important}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important}
  #print-root .page{break-after:page;page-break-after:always;margin:0;box-shadow:none}
  #print-root .page:last-child{break-after:auto;page-break-after:auto}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="top-row">
      <span class="brand">시험에 <em>다나와</em></span>
      <div class="unit-pick">
        <label for="unit-select" class="sr-only">단원 고르기</label>
        <select id="unit-select"></select>
        <button type="button" class="btn" id="btn-new">새 단원</button>
        <button type="button" class="btn" id="btn-copy">복제</button>
        <button type="button" class="btn danger" id="btn-del">지우기</button>
      </div>
      <span class="spacer"></span>
      <button type="button" class="btn" id="btn-export">백업 파일 저장</button>
      <button type="button" class="btn" id="btn-import">단원 파일 불러오기</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
      <span class="save-state" id="save-state" aria-live="polite"></span>
    </div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS_KEY='unit-sheets.v2', OLD_KEYS=['unit-sheets.v1'], APP_ID='unit-sheets', DATA_VERSION=2;
const BRAND='시험에 다나와', BRAND_HTML='<span class="ph-brand">시험에 <em>다나와</em></span>';
const HEADER_DEFAULT='by TR.DN'; /* 11-06 선생님: 그럼Grammar처럼 머리글 문구 */
const SHEETS=[['vocab','단어','VOCABULARY'],['conv','대화문','CONVERSATION'],['grammar','문법','GRAMMAR'],['reading','본문','READING']];
const SHEET_KO=Object.fromEntries(SHEETS.map(s=>[s[0],s[1]]));
const SHEET_EN=Object.fromEntries(SHEETS.map(s=>[s[0],s[2]]));
const FONT_SIZES=[8.5,9,9.5,10,10.5,11,12];
const DEFAULT_LEVELS={basic:{bank:true,hint:false,trans:'show',notes:false},adv:{bank:false,hint:false,trans:'show',notes:false}};
const LEVEL_LABELS={kr:{basic:'기본형',adv:'심화형'},ab:{basic:'A형',adv:'B형'},none:{basic:'',adv:''}};
const VERSION_LABEL={summary:'정리본',blank:'빈칸본'};
const ROLE_KO={S:'주어',V:'동사',O:'목적어',C:'보어',X:'핵심'};
const PX_MM=96/25.4;
const PAGE={w:210,h:297,mt:11,mb:12,ml:12,gap:6};
const uid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const str=v=>typeof v==='string'?v:'';
const arr=a=>Array.isArray(a)?a:[];

/* ---------- 데이터 ---------- */
const defaultLayout=()=>({vocab:{fs:10},conv:{fs:9},grammar:{fs:10},reading:{fs:9.5,cols:1}});
function emptyUnit(name){
  return {id:uid(),name:name||'새 단원',v:DATA_VERSION,updated:Date.now(),
    meta:{lesson:'',title:'',grade:'',book:'',exam:''},
    vocab:{sections:[]},conv:{functions:[],dialogs:[],points:''},grammar:{points:[]},
    reading:{title:'',titleKo:'',text:'',flow:''},
    checked:{vocab:false,conv:false,grammar:false,reading:false},layout:defaultLayout()};
}
function normUnit(u){
  if(!u||typeof u!=='object') return null;
  const d=emptyUnit();
  const m=u.meta||{};
  const lay=defaultLayout();
  if(u.layout) for(const k of Object.keys(lay)){ const f=Number(u.layout[k]&&u.layout[k].fs); if(FONT_SIZES.includes(f)) lay[k].fs=f; }
  if(u.layout&&u.layout.reading&&Number(u.layout.reading.cols)===2) lay.reading.cols=2;
  const ck=u.checked||{};
  return {id:str(u.id)||d.id,name:str(u.name).trim()||'이름 없는 단원',v:DATA_VERSION,updated:Number(u.updated)||Date.now(),
    meta:{lesson:str(m.lesson),title:str(m.title),grade:str(m.grade),book:str(m.book),exam:str(m.exam)},
    vocab:{sections:arr(u.vocab&&u.vocab.sections).map(s=>({title:str(s&&s.title),kind:s&&s.kind==='defs'?'defs':'list',text:str(s&&s.text)}))},
    conv:{functions:arr(u.conv&&u.conv.functions).map(f=>({title:str(f&&f.title),model:str(f&&f.model),ask:str(f&&f.ask),answer:str(f&&f.answer),note:str(f&&f.note)})),
          dialogs:arr(u.conv&&u.conv.dialogs).map(g=>({title:str(g&&g.title),situation:str(g&&g.situation),lines:str(g&&g.lines)})),
          points:str(u.conv&&u.conv.points)},
    grammar:{points:arr(u.grammar&&u.grammar.points).map(p=>({title:str(p&&p.title),rep:str(p&&p.rep),repKo:str(p&&p.repKo),
          parts:arr(p&&p.parts).map(x=>({title:str(x&&x.title),body:str(x&&x.body)}))}))},
    reading:{title:str(u.reading&&u.reading.title),titleKo:str(u.reading&&u.reading.titleKo),text:str(u.reading&&u.reading.text),flow:str(u.reading&&u.reading.flow)},
    checked:{vocab:!!ck.vocab,conv:!!ck.conv,grammar:!!ck.grammar,reading:!!ck.reading},layout:lay};
}
function normSettings(s){
  const out={levels:JSON.parse(JSON.stringify(DEFAULT_LEVELS)),levelLabel:'kr',header:HEADER_DEFAULT};
  if(s&&typeof s==='object'){
    for(const lv of ['basic','adv']){ const x=s.levels&&s.levels[lv]; if(!x) continue;
      if(['show','hide','write'].includes(x.trans)) out.levels[lv].trans=x.trans;
      for(const k of ['bank','hint','notes']) if(typeof x[k]==='boolean') out.levels[lv][k]=x[k]; }
    if(LEVEL_LABELS[s.levelLabel]) out.levelLabel=s.levelLabel;
    if(typeof s.header==='string') out.header=s.header.slice(0,40);
  }
  return out;
}

/* ---------- 저장 ---------- */
let store=null, storageOK=true, saveTimer=null, lastSaved=null, saveFailed=false;
function loadStore(){
  let raw=null;
  try{ raw=localStorage.getItem(LS_KEY); OLD_KEYS.forEach(k=>localStorage.removeItem(k)); }catch(e){ storageOK=false; }
  let st=null; try{ st=raw?JSON.parse(raw):null; }catch(e){ st=null; }
  const units=st&&Array.isArray(st.units)?st.units.map(normUnit).filter(Boolean):[];
  const ui=(st&&st.ui)||{};
  store={units,currentId:units.some(u=>u.id===(st&&st.currentId))?st.currentId:(units[0]?units[0].id:null),
    settings:normSettings(st&&st.settings),
    ui:{sheet:SHEET_KO[ui.sheet]?ui.sheet:'vocab',level:ui.level==='adv'?'adv':'basic',version:ui.version==='blank'?'blank':'summary'}};
}
function saveNow(){
  saveTimer=null;
  try{ localStorage.setItem(LS_KEY,JSON.stringify({app:APP_ID,version:DATA_VERSION,units:store.units,currentId:store.currentId,settings:store.settings,ui:store.ui})); lastSaved=new Date(); saveFailed=false; }
  catch(e){ saveFailed=true; }
  showSaveState();
}
function scheduleSave(){ if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,400); }
function showSaveState(){
  const el=$('#save-state');
  if(!storageOK||saveFailed){ el.textContent='⚠ 이 브라우저에 저장할 수 없어요. 백업 파일로 저장해 주세요.'; el.classList.add('fail'); return; }
  el.classList.remove('fail');
  el.textContent=lastSaved?`자동 저장됨 · 이 브라우저 · ${String(lastSaved.getHours()).padStart(2,'0')}:${String(lastSaved.getMinutes()).padStart(2,'0')}`:'이 컴퓨터의 이 브라우저에 자동 저장돼요';
  el.title='단원 내용은 이 컴퓨터의 이 브라우저에만 저장됩니다. 다른 컴퓨터로 옮길 때는 백업 파일을 저장해서 불러오세요.';
}
const cur=()=>store.units.find(u=>u.id===store.currentId)||store.units[0]||null;
function touched(){ const u=cur(); if(u) u.updated=Date.now(); scheduleSave(); }

/* ---------- 표시 규칙 해석 ---------- */
/* [[ ]] 빈칸(모든 수준)  {{ }} 심화형만 빈칸  ((말|설명)) 파란 설명  {S:말|이름} 문장 성분  **굵게** */
function parseRich(s){
  let i=0;
  const roleAt=()=>{ const m=/^\{([SVOCX]):/.exec(s.slice(i,i+3)); return m?m[1]:null; };
  function until(stops){
    const nodes=[]; let buf='';
    const flush=()=>{ if(buf){ nodes.push({t:'text',s:buf}); buf=''; } };
    while(i<s.length){
      if(stops.includes('))')&&s.startsWith(')))',i)){ buf+=')'; i++; continue; }
      for(const st of stops) if(s.startsWith(st,i)){ flush(); return {nodes,stop:st}; }
      if(s.startsWith('[[',i)||s.startsWith('{{',i)){
        const adv=s[i]==='{'; const close=adv?'}}':']]'; flush(); const save=i; i+=2;
        const r=until([close]); if(r.stop===close){ i+=2; nodes.push({t:'key',adv,c:r.nodes}); } else { i=save; buf+=s.slice(i,i+2); i+=2; }
        continue;
      }
      if(s.startsWith('((',i)){
        flush(); const save=i; i+=2;
        const r=until(['|','))']);
        if(r.stop==='|'){ i+=1; const r2=until(['))']); if(r2.stop==='))'){ i+=2; nodes.push({t:'note',c:r.nodes,note:r2.nodes}); continue; } }
        else if(r.stop==='))'){ i+=2; nodes.push({t:'note',c:r.nodes,note:[]}); continue; }
        i=save; buf+='(('; i+=2; continue;
      }
      const role=roleAt();
      if(role){
        flush(); const save=i; i+=3;
        const r=until(['|','}']);
        if(r.stop==='|'){ i+=1; const r2=until(['}']); if(r2.stop==='}'){ i+=1; nodes.push({t:'role',role,c:r.nodes,label:textOf(r2.nodes)}); continue; } }
        else if(r.stop==='}'){ i+=1; nodes.push({t:'role',role,c:r.nodes,label:''}); continue; }
        i=save; buf+=s[i]; i+=1; continue;
      }
      if(s.startsWith('**',i)){
        flush(); const save=i; i+=2; const r=until(['**']);
        if(r.stop==='**'){ i+=2; nodes.push({t:'b',c:r.nodes}); continue; }
        i=save; buf+='**'; i+=2; continue;
      }
      buf+=s[i]; i++;
    }
    flush(); return {nodes,stop:null};
  }
  return until([]).nodes;
}
function textOf(nodes){ return nodes.map(n=>n.t==='text'?n.s:textOf(n.c||[])).join(''); }
function bracketIssue(s){
  const c=re=>(s.match(re)||[]).length; const out=[];
  if(c(/\[\[/g)!==c(/\]\]/g)) out.push('[[ ]]');
  if(c(/\{\{/g)!==c(/\}\}/g)) out.push('{{ }}');
  if(c(/\(\(/g)!==c(/\)\)/g)) out.push('(( ))');
  return out.length?`${out.join(', ')} 짝이 맞지 않아요.`:'';
}
/* 괄호 밖에 있는 구분 기호에서 한 번만 나눔 */
function splitTop(s,sep){
  let d=0;
  for(let i=0;i<s.length;i++){
    const two=s.slice(i,i+2);
    if(two==='[['||two==='{{'||two==='(('){ d++; i++; continue; }
    if(two===']]'||two==='}}'||two==='))'){ d=Math.max(0,d-1); i++; continue; }
    if(/^\{[SVOCX]:/.test(s.slice(i,i+3))){ d++; i+=2; continue; }
    if(s[i]==='}'&&d>0){ d--; continue; }
    if(d===0&&s.startsWith(sep,i)) return [s.slice(0,i),s.slice(i+sep.length)];
  }
  return [s,null];
}
function splitTr(s){ const [a,b]=splitTop(s,'|'); return {en:a.trim(),tr:b==null?'':b.trim()}; }
function lines(text,{star=false,adv=true}={}){
  return text.split(/\r?\n/).map(raw=>{
    let s=raw.trim(); if(!s) return null;
    let isAdv=false,isStar=false;
    for(;;){ if(adv&&s[0]==='+'){isAdv=true;s=s.slice(1).trimStart();continue;} if(star&&s[0]==='*'&&s[1]!=='*'){isStar=true;s=s.slice(1).trimStart();continue;} break; }
    return {s,adv:isAdv,star:isStar};
  }).filter(Boolean);
}
const visible=(ls,ctx)=>ls.filter(l=>!(l.adv&&ctx.level==='basic'));

/* ---------- 그리기 ---------- */
function hashStr(s){ let h=2166136261; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function seeded(a){ return ()=>{ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffled(list,seed){
  const r=seeded(hashStr(seed)||1); const a=list.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  if(a.length>1&&a.every((x,i)=>x===list[i])) a.push(a.shift());
  return a;
}
const isWide=ch=>/[ᄀ-ᇿ　-鿿가-힯＀-￯]/.test(ch);
const textWidthEm=s=>Array.from(s).reduce((a,ch)=>a+(isWide(ch)?1:0.56),0);
function blankHtml(ans,num,hint,tail=''){
  const a=ans.trim();
  const numH=`<span class="bn">${num}</span>`;
  if(hint&&a){
    const parts=a.split(/\s+/).map(w=>{ const c=Array.from(w); const rest=c.slice(1).join(''); return esc(c[0])+`<span class="ul" style="width:${Math.max(.9,textWidthEm(rest)*1.1+.4).toFixed(2)}em"></span>`; }).join(' ');
    return `<span class="blank">${numH}${parts}${esc(tail)}</span>`;
  }
  const w=Math.min(16,Math.max(3.4,textWidthEm(a)*0.95+1.1));
  return `<span class="blank">${numH}<span class="ul" style="width:${w.toFixed(2)}em"></span>${esc(tail)}</span>`;
}
const KO_RE=/([~(\[]*[ㄱ-힝][^A-Za-z=↔→|]*)/;
function koWrap(s){
  return s.split(KO_RE).map((part,k)=>{
    if(k%2===0) return esc(part);
    const m=part.match(/^(.*?)(\s*)$/);
    return `<span class="ko">${esc(m[1])}</span>${esc(m[2])}`;
  }).join('');
}
const PUNCT_RE=/^[.,!?;:)’”'"…]+/;
function renderNodes(nodes,ctx,o,tail=''){
  let out=''; nodes=nodes.slice();
  for(let k=0;k<nodes.length;k++){
    const nd=nodes[k], nx=nodes[k+1]; let t='';
    if(nd.t!=='text'&&nx&&nx.t==='text'){ const m=nx.s.match(PUNCT_RE); if(m){ t=m[0]; nodes[k+1]={t:'text',s:nx.s.slice(t.length)}; } }
    if(k===nodes.length-1){ t+=tail; tail=''; }
    out+=renderNode(nd,ctx,o,t);
  }
  return out+esc(tail);
}
function renderNode(nd,ctx,o,tail){
  if(nd.t==='text') return (o.ko?koWrap(nd.s):esc(nd.s))+esc(tail);
  if(nd.t==='b') return `<b>${renderNodes(nd.c,ctx,o)}</b>${esc(tail)}`;
  if(nd.t==='key'){
    if(o.noKey||(nd.adv&&ctx.level==='basic')) return renderNodes(nd.c,ctx,o,tail);
    const num=++ctx.n;
    if(ctx.version==='summary'){
      let first='',rest=nd.c;
      if(nd.c[0]&&nd.c[0].t==='text'){ const m=nd.c[0].s.match(/^(\s*\S+)([\s\S]*)$/); if(m){ first=o.ko?koWrap(m[1]):esc(m[1]); rest=[{t:'text',s:m[2]},...nd.c.slice(1)]; } }
      return `<span class="key"><span class="nw"><span class="bn">${num}</span>${first}</span>${renderNodes(rest,ctx,o)}</span>${esc(tail)}`;
    }
    const plain=textOf(nd.c).trim(); ctx.answers.push(plain);
    return blankHtml(plain,num,ctx.opt.hint,tail);
  }
  if(nd.t==='note'){
    if(!ctx.showNotes) return renderNodes(nd.c,ctx,o,tail);
    if(!nd.note.length) return `<span class="an-t">${renderNodes(nd.c,ctx,o)}</span>${esc(tail)}`;
    let first='', rest=nd.c;
    if(nd.c[0]&&nd.c[0].t==='text'){ const m=nd.c[0].s.match(/^(\s*\S+)([\s\S]*)$/); if(m){ rest=[{t:'text',s:m[2]},...nd.c.slice(1)]; first=o.ko?koWrap(m[1]):esc(m[1]); } }
    else if(nd.c[0]){ rest=nd.c.slice(1); first=renderNodes([nd.c[0]],ctx,o,rest.length?'':tail); if(!rest.length) tail=''; }
    const restEmpty=!rest.length||(rest.length===1&&rest[0].t==='text'&&!rest[0].s);
    if(restEmpty&&tail){ first+=esc(tail); tail=''; }
    const note=renderNodes(nd.note,ctx,{ko:false,noKey:true});
    return `<span class="an-t"><span class="nw"><span class="an-sp"><span class="an-n">↳ ${note}</span></span>${first}</span>${restEmpty?'':renderNodes(rest,ctx,o)}</span>${esc(tail)}`;

function fixAnnotations(blk){
  const sps=Array.from(blk.querySelectorAll('.an-sp')), roles=Array.from(blk.querySelectorAll('.an.role'));
  if(!sps.length&&!roles.length) return;
  sps.forEach(sp=>{ sp.style.height=''; const n=sp.firstElementChild; n.style.top=''; n.style.left=''; });
  roles.forEach(a=>{ a.style.paddingBottom=''; const n=a.lastElementChild; n.style.top=''; n.style.left=''; });
  const box=blk.getBoundingClientRect(), items=[];
  sps.forEach(sp=>{
    const n=sp.firstElementChild, nw=sp.parentElement, spR=sp.getBoundingClientRect(), nwR=nw.getBoundingClientRect(), nR=n.getBoundingClientRect();
    const lh=parseFloat(getComputedStyle(n).lineHeight)||nR.height;
    items.push({kind:'note',el:sp,n,base:nwR.bottom,x:spR.left,left:spR.left,w:nR.width,lh,off:nwR.bottom-spR.top+.5});
  });
  roles.forEach(a=>{
    const t=a.firstElementChild, n=a.lastElementChild, tR=t.getBoundingClientRect(), nR=n.getBoundingClientRect(), aR=a.getBoundingClientRect();
    const lh=parseFloat(getComputedStyle(n).lineHeight)||nR.height;
    items.push({kind:'role',el:a,n,base:tR.bottom,x:aR.left,left:tR.left+tR.width/2-nR.width/2,w:nR.width,lh,off:tR.bottom-aR.top});
  });
  items.sort((p,q)=>p.base-q.base||p.left-q.left);
  const groups=[]; items.forEach(it=>{ const g=groups[groups.length-1]; if(g&&Math.abs(g[0].base-it.base)<it.lh*0.8) g.push(it); else groups.push([it]); });
  groups.forEach(g=>{
    g.sort((p,q)=>p.left-q.left);
    const rows=[];
    g.forEach(it=>{
      let left=it.left;
      if(left+it.w>box.right) left=box.right-it.w;
      if(left<box.left) left=box.left;
      let r=0; while(rows[r]!==undefined&&left<rows[r]+3) r++;
      rows[r]=left+it.w;
      it.n.style.left=(left-it.x).toFixed(1)+'px';
      it.n.style.top=(it.off+r*it.lh).toFixed(1)+'px';
      if(it.kind==='note') it.el.style.height=(it.off+(r+1)*it.lh).toFixed(1)+'px';
      else it.el.style.paddingBottom=((r+1)*it.lh).toFixed(1)+'px';
    });
  });
}
function paginate(sh,fs){
  const M=$('#measure');
  const fullW=PAGE.w-2*PAGE.ml, colW=sh.cols===2?(fullW-PAGE.gap)/2:fullW;
  M.innerHTML=`<div class="sheet ${sh.vclass}" style="--fs:${fs}pt"><div style="width:${fullW}mm">${sh.first}</div><div style="width:${fullW}mm">${sh.cont}</div><div></div></div>`;
  const root=M.firstElementChild, holder=root.children[2];
  const els=sh.blocks.map(b=>{ const w=document.createElement('div'); w.style.width=(b.span?fullW:colW)+'mm'; w.innerHTML=`<div class="blk">${b.html}</div>`; holder.appendChild(w); return w.firstElementChild; });
  els.forEach(fixAnnotations);
  const H=el=>el.getBoundingClientRect().height;
  const hFirst=H(root.children[0]), hCont=H(root.children[1]);
  const bh=els.map(H), html=els.map(el=>el.outerHTML);
  M.innerHTML='';
  const contentH=(PAGE.h-PAGE.mt-PAGE.mb)*PX_MM-2;
  const pages=[]; let page=null, y=0, overflow=false;
  const newPage=()=>{ page={first:!pages.length,rows:[]}; pages.push(page); y=page.first?hFirst:hCont; };
  newPage();
  const n=sh.blocks.length;
  const keepNeed=(i,list,pos)=>{ const b=sh.blocks[i]; if(!b.keep) return bh[i]; const nx=list?list[pos+1]:i+1; return bh[i]+((nx!=null&&nx<n)?bh[nx]:0); };
  /* 단 채우기: cap 높이로 k단에 넣을 수 있는 만큼 */
  const fill=(list,cap,k)=>{
    const cols=[[]],hs=[0]; let c=0,placed=0;
    for(let p=0;p<list.length;p++){
      const i=list[p], need=keepNeed(i,list,p);
      if(hs[c]+need>cap+.5&&cols[c].length){ if(c+1>=k) break; c++; cols.push([]); hs.push(0); }
      if(hs[c]+bh[i]>cap+.5&&cols[c].length===0&&c+1>=k&&placed>0) break;
      cols[c].push(i); hs[c]+=bh[i]; placed++;
    }
    return {cols,hs,placed};
  };
  let i=0;
  while(i<n){
    const b=sh.blocks[i];
    if(b.span||sh.cols===1){
      const need=b.keep&&i+1<n?bh[i]+Math.min(bh[i+1],contentH*0.3):bh[i];
      if(y+need>contentH+.5&&page.rows.length) newPage();
      page.rows.push({span:true,idx:[i]}); y+=bh[i]; if(y>contentH+1) overflow=true; i++; continue;
    }
    let j=i; const list=[]; while(j<n&&!sh.blocks[j].span){ list.push(j); j++; }
    let rest=list;
    while(rest.length){
      const avail=contentH-y;
      const all=fill(rest,avail,2);
      if(all.placed===rest.length){
        let lo=Math.max(...rest.map((x,p)=>keepNeed(x,rest,p))),hi=avail,best=all;
        for(let it=0;it<18&&hi-lo>1;it++){ const mid=(lo+hi)/2; const f=fill(rest,mid,2); if(f.placed===rest.length){ hi=mid; best=f; } else lo=mid; }
        page.rows.push({span:false,cols:best.cols}); y+=Math.max(...best.hs); rest=[]; break;
      }
      if(all.placed===0){
        if(page.rows.length){ newPage(); continue; }
        page.rows.push({span:false,cols:[[rest[0]],[]]}); overflow=true; y+=bh[rest[0]]; rest=rest.slice(1); newPage(); continue;
      }
      page.rows.push({span:false,cols:all.cols}); rest=rest.slice(all.placed); newPage();
    }
    i=j;
  }
  if(!page.rows.length&&pages.length>1) pages.pop();
  return {pages,overflow,html};
}
function pagesHtml(sh,pg,fs){
  const total=pg.pages.length;
  return pg.pages.map((p,pi)=>`<div class="page sheet ${sh.vclass}" style="--fs:${fs}pt">${p.first?sh.first:sh.cont}${p.rows.map(r=>r.span?pg.html[r.idx[0]]:`<div class="row-cols${sh.cols===2?' c2':''}">${r.cols.map(c=>`<div>${c.map(i=>pg.html[i]).join('')}</div>`).join('')}</div>`).join('')}<div class="pfoot"><span>${sh.foot}</span><span>${pi+1} / ${total}</span></div></div>`);
}
const blankPage=()=>'<div class="page sheet"></div>';
function fitSize(u,sheet){
  let one=null,two=null,empty=false;
  for(const fs of FONT_SIZES.slice().reverse()){
    let max=0,ov=false;
    for(const lv of ['basic','adv']) for(const vs of ['summary','blank']){ const c=compose(u,sheet,lv,vs,fs); if(c.sh.empty){ empty=true; } max=Math.max(max,c.html.length); ov=ov||c.pg.overflow; }
    if(empty) return {empty:true};
    if(max===1&&!ov){ one=fs; break; }
    if(max<=2&&!ov&&two===null) two=fs;

function compose(u,sheet,level,version,fsOverride){
  const sh=buildSheet(u,sheet,level,version);

function getPath(obj,path){ return path.split('.').reduce((o,k)=>o==null?o:o[/^\d+$/.test(k)?+k:k],obj); }

function updateLive(path){
  const el=$(`[data-live="${CSS.escape(path)}"]`); const u=cur(); if(!el||!u) return;
  const val=getPath(u,path)||''; const ok=[],warn=[];
  const b=bracketIssue(val); if(b) warn.push(b);
  const ls=lines(val,{star:true});

    const keys=(val.match(/\[\[/g)||[]).length, adv=(val.match(/\{\{/g)||[]).length, notes=(val.match(/\(\(/g)||[]).length;

  if(path==='reading.text'){ const noTr=ls.filter(l=>!l.s.startsWith('#')&&!splitTr(l.s).tr).length; if(noTr) warn.push(`해석이 없는 문장 ${noTr}개`); }

}

function printAllList(){

    updateLive(path); touched(); scheduleRender();
  });
  $('#editor').addEventListener('change',e=>{ const u=cur(); if(u&&e.target.dataset&&e.target.dataset.path==='name'&&!e.target.value.trim()){ u.name='이름 없는 단원'; renderUnitSelect(); touched(); } });
  $('#editor').addEventListener('click',e=>{
    const em=e.target.closest('[data-empty]');
    if(em){ if(em.dataset.empty==='import') $('#file-import').click(); else newUnit(); return; }
    const b=e.target.closest('button[data-act]'); if(!b||!cur()) return;
    const kind=b.dataset.kind, i=+b.dataset.i, j=b.dataset.j!=null?+b.dataset.j:null;
    const list=listOf(kind,i), k=kind==='gpart'?j:i;
    if(b.dataset.act==='add') list.push(NEWITEM[kind]());
    else if(b.dataset.act==='up'&&k>0) [list[k-1],list[k]]=[list[k],list[k-1]];
    else if(b.dataset.act==='down'&&k<list.length-1) [list[k+1],list[k]]=[list[k],list[k+1]];
    else if(b.dataset.act==='del'){
      const [item]=list.splice(k,1);
      toast(`${KIND_NAME[kind]}을(를) 지웠어요.`,'되돌리기',()=>{ listOf(kind,i).splice(k,0,item); touched(); renderEditor(); renderPreview(); });
    }
    touched(); renderEditor(); renderPreview();
  });
  $('#tabs').addEventListener('click',e=>{ const t=e.target.closest('[data-sheet]'); if(t) selectSheet(t.dataset.sheet); });
  $('#tabs').addEventListener('keydown',e=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
    const ids=SHEETS.map(s=>s[0]); let i=ids.indexOf(store.ui.sheet);
    i=e.key==='ArrowLeft'?(i+3)%4:e.key==='ArrowRight'?(i+1)%4:e.key==='Home'?0:3;
    e.preventDefault(); selectSheet(ids[i]); $(`#tab-${ids[i]}`).focus();
  });
  $$('input[name="level"]').forEach(r=>r.addEventListener('change',()=>{ store.ui.level=r.value; scheduleSave(); syncToolbar(); renderPreview(); }));
  $$('input[name="version"]').forEach(r=>r.addEventListener('change',()=>{ store.ui.version=r.value; scheduleSave(); renderPreview(); }));
  $('#font-size').addEventListener('change',e=>{ const u=cur(); if(!u) return; u.layout[store.ui.sheet].fs=Number(e.target.value); touched(); renderPreview(); });
  $('#cols').addEventListener('change',e=>{ const u=cur(); if(!u) return; u.layout.reading.cols=Number(e.target.value)===2?2:1; touched(); renderPreview(); });
  $('#btn-fit').addEventListener('click',()=>{
    const u=cur(), ui=store.ui; if(!u){ toast('단원이 없어요.'); return; }
    const r=fitSize(u,ui.sheet);
    if(r.empty){ toast('이 장에 내용이 없어요.'); return; }
    if(r.one){ u.layout[ui.sheet].fs=r.one; touched(); syncToolbar(); renderPreview(); toast(`글자 ${r.one}pt로 맞췄어요. 기본형·심화형, 정리본·빈칸본 모두 1면이에요.`); }
    else if(r.two){ u.layout[ui.sheet].fs=r.two; touched(); syncToolbar(); renderPreview(); toast(`${FONT_SIZES[0]}pt로도 1면에 다 들어가지 않아요. 네 가지 모두 양면 1장이 되는 ${r.two}pt로 바꿨어요.`); }
    else toast(`${FONT_SIZES[0]}pt로도 양면 1장을 넘는 것이 있어요. 내용을 줄여 주세요.`);
  });
  const optChange=()=>{ const o=store.settings.levels[store.ui.level]; o.bank=$('#o-bank').checked; o.hint=$('#o-hint').checked; o.notes=$('#o-notes').checked; o.trans=$('#o-trans').value; store.settings.levelLabel=$('#o-levelLabel').value; scheduleSave(); renderPreview(); };
  ['#o-bank','#o-hint','#o-notes','#o-trans','#o-levelLabel'].forEach(s=>$(s).addEventListener('change',optChange));
  $('#o-header').addEventListener('input',e=>{ store.settings.header=e.target.value.slice(0,40); scheduleSave(); scheduleRender(); });
  $('#btn-print').addEventListener('click',()=>{
    const u=cur(); if(!u){ toast('단원이 없어요.'); return; }
    const c=compose(u,store.ui.sheet,store.ui.level,store.ui.version);
    if(c.sh.empty){ toast('이 장에 내용이 없어요.'); return; }
    printHtml(c.html);
  });
  $('#pa-sheets').insertAdjacentHTML('beforeend',SHEETS.map(([id,ko])=>`<label><input type="checkbox" name="pa-sheet" value="${id}" checked> ${ko}</label>`).join(''));
  $('#btn-print-all').addEventListener('click',()=>{ if(!cur()){ toast('단원이 없어요.'); return; } updatePrintSum(); $('#dlg-print').showModal(); });
  $('#dlg-print').addEventListener('change',updatePrintSum);
  $('#dlg-print').addEventListener('close',()=>{ if($('#dlg-print').returnValue==='go'){ const r=printAllList(); if(r.docs) printHtml(r.pages); else toast('인쇄할 내용이 없어요.'); } });
  $('#unit-select').addEventListener('change',e=>{ store.currentId=e.target.value; scheduleSave(); renderAll(); });
  $('#btn-new').addEventListener('click',newUnit);
  $('#btn-copy').addEventListener('click',()=>{ const src=cur(); if(!src){ toast('복제할 단원이 없어요.'); return; } const u=normUnit(JSON.parse(JSON.stringify(src))); u.id=uid(); u.name=src.name+' 사본'; u.updated=Date.now(); store.units.splice(store.units.indexOf(src)+1,0,u); store.currentId=u.id; scheduleSave(); renderAll(); toast('단원을 복제했어요.'); });
  $('#btn-del').addEventListener('click',()=>{ const u=cur(); if(!u){ toast('지울 단원이 없어요.'); return; } $('#del-msg').textContent=`‘${u.name}’ 단원을 지울까요? 이 브라우저에서 지워지고, 백업 파일이 없으면 되돌릴 수 없어요.`; $('#dlg-del').showModal(); });
  $('#dlg-del').addEventListener('close',()=>{
    if($('#dlg-del').returnValue!=='del') return;
    const u=cur(); const i=store.units.indexOf(u); store.units.splice(i,1);
    store.currentId=store.units.length?store.units[Math.max(0,i-1)].id:null; scheduleSave(); renderAll(); toast(`‘${u.name}’ 단원을 지웠어요.`);
  });
  $('#btn-export').addEventListener('click',()=>{
    if(!store.units.length){ toast('저장할 단원이 없어요.'); return; }
    const d=new Date(), ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const blob=new Blob([JSON.stringify({app:APP_ID,version:DATA_VERSION,exported:d.toISOString(),units:store.units,settings:store.settings},null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`시험에다나와-백업-${ds}.json`;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
    toast(`단원 ${store.units.length}개를 백업 파일로 저장했어요.`);
  });
  $('#btn-import').addEventListener('click',()=>$('#file-import').click());
  $('#file-import').addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      let data; try{ data=JSON.parse(rd.result); }catch(err){ toast('파일을 읽을 수 없어요. 이 앱용 단원 파일(.json)인지 확인해 주세요.'); return; }
      const raw=Array.isArray(data)?data:Array.isArray(data&&data.units)?data.units:(data&&data.vocab?[data]:null);
      if(!raw){ toast('단원이 들어 있지 않은 파일이에요.'); return; }
      if(raw.some(x=>x&&x.words&&!x.vocab)){ toast('예전 형식(첫 버전) 파일이라 불러올 수 없어요.'); return; }
      const units=raw.map(normUnit).filter(Boolean);
      if(!units.length){ toast('불러올 단원이 없어요.'); return; }
      const ids=new Set(store.units.map(u=>u.id));
      units.forEach(u=>{ if(ids.has(u.id)){ u.id=uid(); u.name+=' (불러옴)'; } ids.add(u.id); store.units.push(u); });
      store.currentId=units[0].id; scheduleSave(); renderAll();
      toast(`단원 ${units.length}개를 불러왔어요.`);
    };
    rd.onerror=()=>toast('파일을 읽는 중에 문제가 생겼어요. 다시 시도해 주세요.');
    rd.readAsText(f);
  });
  if('ResizeObserver' in window){ let w=0; new ResizeObserver(en=>{ const nw=Math.round(en[0].contentRect.width); if(Math.abs(nw-w)>4){ w=nw; scheduleRender(); } }).observe($('#pages')); }
  window.addEventListener('pagehide',()=>{ if(saveTimer){ clearTimeout(saveTimer); saveNow(); } });
}
function selectSheet(id){ store.ui.sheet=id; scheduleSave(); renderTabs(); syncToolbar(); renderEditor(); renderPreview(); }

loadStore(); bind(); renderAll();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>renderPreview());
window.__unitSheets={get store(){return store;},compose,parseRich,splitTop,printAllList,fitSize};
})();
</script>
</body>
</html>
