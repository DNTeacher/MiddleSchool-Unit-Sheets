<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>단원 정리본 만들기</title>
<style>
/* 화면: 교사 작업 화면(칠판 녹색 하나만 강조색) / 종이: 흑백 인쇄 기준 */
:root{
  --font:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Nanum Gothic',sans-serif;
  --bg:#e7ebe8; --panel:#fbfcfb; --ink:#1b2320; --muted:#55625c; --line:#cbd3ce;
  --accent:#1e5a45; --accent-ink:#ffffff; --accent-soft:#dcebe3;
  --warn:#874700; --warn-soft:#fbecd6; --danger:#a12a2a; --field:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1c2320; --ink:#e6ece9; --muted:#a2afa9; --line:#34403a;
  --accent:#7cc3a3; --accent-ink:#0e1a14; --accent-soft:#233a30;
  --warn:#f1b768; --warn-soft:#3b2b14; --danger:#f19090; --field:#151b18; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1c2320; --ink:#e6ece9; --muted:#a2afa9; --line:#34403a;
  --accent:#7cc3a3; --accent-ink:#0e1a14; --accent-soft:#233a30;
  --warn:#f1b768; --warn-soft:#3b2b14; --danger:#f19090; --field:#151b18; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.5;background:var(--bg);color:var(--ink);word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}

/* 맨 위 막대 */
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{font-weight:700;font-size:16px;margin-right:6px;white-space:nowrap}
.unit-pick{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.unit-pick select{max-width:min(320px,70vw)}
.spacer{flex:1}
.save-state{font-size:12.5px;color:var(--muted);white-space:nowrap}
.save-state.fail{color:var(--warn)}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 16px 10px;border-bottom:3px solid transparent;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-weight:400;font-size:12px;margin-left:4px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--danger)}
.btn.small{padding:3px 8px;font-size:12.5px}
select,input[type="text"]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--field)}

/* 작업 영역 */
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,450px) minmax(0,1fr)}
.editor{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.preview{overflow:auto;min-width:0;display:flex;flex-direction:column}
@media (max-width:980px){
  .app{height:auto}
  .work{grid-template-columns:minmax(0,1fr)}
  .editor{border-right:0;border-bottom:1px solid var(--line);overflow:visible;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .preview{overflow:visible}
}

/* 입력 */
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.fld label,.lbl{font-weight:700;font-size:13.5px}
.fld textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 9px;background:var(--field);line-height:1.55;resize:vertical;font-size:13.5px;tab-size:4}
.fld input[type="text"]{width:100%}
.help{margin:0;font-size:12.5px;color:var(--muted)}
.live{margin:0;font-size:12.5px;min-height:0}
.live .ok{color:var(--muted)}
.live .warn{color:var(--warn);display:block}
.ed-head{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.sample-note{background:var(--accent-soft);border-radius:6px;padding:9px 11px;font-size:12.5px}
details.rules{border:1px solid var(--line);border-radius:6px;padding:8px 11px;font-size:13px}
details.rules summary{cursor:pointer;font-weight:700}
.rules table{border-collapse:collapse;margin-top:8px;width:100%}
.rules td{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top}
.rules code,.help code{font-family:var(--font);background:var(--accent-soft);padding:0 4px;border-radius:3px;font-weight:700}
.sec-title{font-size:15px;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;background:var(--panel)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.card-h h3{margin:0;font-size:14px}
.card-act{display:flex;gap:4px}
.empty-cards{font-size:13px;color:var(--muted);margin:0 0 10px}

/* 미리보기 도구 */
.pv-bar{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:6px 12px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+label{outline:3px solid var(--accent);outline-offset:-3px}
.ctl{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.pages-info{font-size:13px;font-weight:700}
.pages-info.warn{color:var(--warn)}
.pv-opts{padding:0 16px}
.pv-opts details{background:var(--panel);border:1px solid var(--line);border-radius:7px;margin-top:10px;padding:8px 12px;font-size:13px}
.pv-opts summary{cursor:pointer;font-weight:700}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 18px;margin-top:10px}
.opt-grid .ctl{flex-wrap:wrap}
.opt-note{margin:8px 0 0;color:var(--muted);font-size:12.5px}
.print-tip{margin:8px 16px 0;font-size:12.5px;color:var(--muted)}
.pv-msg{margin:8px 16px 0;font-size:13px}
.pv-msg:empty{display:none}
.pages{padding:16px;display:flex;flex-direction:column;align-items:center;gap:18px}
.pv-fig{margin:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:100%}
.pv-fig figcaption{font-size:12.5px;color:var(--muted);font-weight:700}
.pv-frame{position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18),0 6px 18px rgba(0,0,0,.10);max-width:100%}
.pv-scale{transform-origin:0 0;position:absolute;left:0;top:0}
.pv-empty{position:absolute;inset:auto 0 40% 0;text-align:center;color:#666;font-size:13pt}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:20;max-width:calc(100vw - 32px);font-size:13.5px}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:5px;padding:3px 9px;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:18px 20px;max-width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 12px;font-size:17px}
dialog fieldset{border:1px solid var(--line);border-radius:7px;margin:0 0 10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 16px}
dialog legend{font-weight:700;font-size:13px;padding:0 4px}
.dlg-act{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#measure{position:absolute;left:-20000px;top:0;visibility:hidden;pointer-events:none}
#print-root{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ===== 종이(A4) — 화면 테마와 상관없이 흰 종이에 검은 글자 ===== */
.page{width:210mm;height:297mm;padding:12mm;background:#fff;color:#111;position:relative;overflow:hidden}
.sheet{font-family:var(--font);font-size:var(--fs,10.5pt);line-height:1.55;color:#111;word-break:keep-all;overflow-wrap:break-word;text-wrap:pretty;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet *{box-sizing:border-box}
.blk{display:flow-root}
.blk.gap{padding-bottom:2.6mm}
.cols{display:grid;grid-template-columns:minmax(0,1fr);position:relative}
.cols.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:6mm}
.cols.c2::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:0.2mm dashed #9a9a9a}
.pfoot{position:absolute;left:12mm;right:12mm;bottom:6mm;font-size:7.5pt;color:#555;text-align:right;font-family:var(--font)}
.ph-wrap{padding-bottom:3mm}
.ph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0.8mm 6mm;align-items:end;padding-bottom:2.2mm;border-bottom:0.6mm solid #111}
.ph-unit{font-size:0.85em;color:#333}
.ph-title{font-size:1.75em;font-weight:700;line-height:1.2;letter-spacing:-0.01em}
.ph-side{display:flex;flex-direction:column;align-items:flex-end;gap:1.2mm}
.ph-tag{font-size:0.82em;border:0.3mm solid #111;padding:0.3mm 2mm;border-radius:1mm;white-space:nowrap}
.ph-name{font-size:0.9em;white-space:nowrap}
.ph-name span{display:inline-block;width:32mm;border-bottom:0.25mm solid #111;margin-left:1.5mm}
.ph-instr{padding-top:2mm;font-size:0.86em;color:#222;display:flex;flex-wrap:wrap;justify-content:space-between;gap:0.5mm 4mm}
.ph-rounds{white-space:nowrap}
.ph-cont{font-size:0.85em;color:#333;padding-bottom:1.6mm;border-bottom:0.3mm solid #111;margin-bottom:2.5mm;display:flex;justify-content:space-between}

.key{font-weight:700;text-decoration:underline;text-decoration-thickness:0.25mm;text-underline-offset:0.6mm}
.bn{display:inline-block;font-size:0.66em;color:#555;font-weight:400;margin-right:0.15em;transform:translateY(-0.45em);text-decoration:none}
.blank{white-space:nowrap}
.ul{display:inline-block;border-bottom:0.25mm solid #111;height:1em;vertical-align:-0.15em}
.v-blank .en,.v-blank .fn-line,.v-blank .g-line,.v-blank .g-ex .en,.v-blank .dl-text{line-height:2.05}
.star{font-weight:700;margin-right:0.25em}
.tr{font-size:0.86em;color:#3a3a3a;line-height:1.5}
.tr.write{border-bottom:0.2mm solid #8a8a8a;height:6.2mm}
.gloss{font-size:0.86em;color:#444;margin-left:0.4em}
.bank{border:0.25mm dashed #555;border-radius:1mm;padding:0.8mm 2.2mm;margin:1.4mm 0 0.4mm;font-size:0.9em;line-height:1.6}
.bank b{margin-right:1.5mm}
.bank .sep{color:#777;margin:0 1.2mm}

.w-row{display:grid;grid-template-columns:2em minmax(0,1.1fr) minmax(0,1fr);column-gap:1.6mm;align-items:baseline;padding:1mm 0;border-bottom:0.2mm solid #bdbdbd;min-height:6.4mm}
.w-row.has-pos{grid-template-columns:2em minmax(0,1.1fr) 2.7em minmax(0,1fr)}
.v-blank .w-row{min-height:8.2mm;padding:1.6mm 0 1mm}
.w-head{font-size:0.8em;font-weight:700;color:#333;border-bottom:0.4mm solid #111;min-height:0!important;padding:0.6mm 0!important}
.w-no{color:#555;font-size:0.85em;font-variant-numeric:tabular-nums}
.w-pos{font-size:0.82em;color:#444}
.w-rel{grid-column:2/-1;font-size:0.86em;color:#333}
.w-group{font-weight:700;padding:2.4mm 0 0.8mm;border-bottom:0.4mm solid #111;font-size:0.95em}

.sec-h{font-weight:700;font-size:1.08em;padding:2.6mm 0 1mm;border-bottom:0.4mm solid #111}
.fn-box{border:0.3mm solid #111;border-radius:1.2mm;padding:1.8mm 3mm 2mm;margin-top:2mm}
.fn-name{font-weight:700;margin-bottom:0.6mm}
.fn-row{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:0 2mm;padding-top:0.6mm;align-items:baseline}
.fn-label{font-size:0.8em;color:#444}
.dl-title{font-weight:700;padding:2.8mm 0 0.6mm;border-bottom:0.3mm solid #111}
.dl-sum{font-size:0.88em;color:#333;padding:0.8mm 0 0.4mm}
.dl-line{display:grid;grid-template-columns:4.8em minmax(0,1fr);gap:0 2mm;padding:0.7mm 0;align-items:baseline}
.dl-sp{font-weight:700}

.p-head{padding:2.6mm 0 0.8mm;border-bottom:0.3mm solid #111;font-weight:700}
.p-no{display:inline-block;background:#111;color:#fff;padding:0 1.6mm;border-radius:0.8mm;margin-right:1.8mm;font-size:0.84em}
.sent{display:grid;grid-template-columns:1.9em minmax(0,1fr);gap:0 1.6mm;padding:1.1mm 0;border-bottom:0.15mm solid #d6d6d6;align-items:baseline}
.s-no{color:#555;font-size:0.85em;text-align:right;font-variant-numeric:tabular-nums}

.g-head{display:flex;gap:2.2mm;align-items:baseline;padding:3mm 0 1.2mm;border-bottom:0.5mm solid #111}
.g-no{font-size:0.82em;border:0.3mm solid #111;padding:0 1.6mm;border-radius:0.8mm;white-space:nowrap}
.g-title{font-weight:700;font-size:1.12em}
.g-form{background:#ededed;padding:1.8mm 3mm;margin-top:1.6mm;border-radius:1mm}
.g-label{font-size:0.82em;font-weight:700;color:#333;padding:1.8mm 0 0.3mm}
.g-ex{padding:0.5mm 0 0.5mm 2.5mm}
.g-note{padding:0.4mm 0 0.4mm 2.5mm}

.q-head{font-weight:700;padding:3mm 0 0.8mm;border-bottom:0.3mm solid #111}
.q{display:grid;grid-template-columns:1.9em minmax(0,1fr);gap:0 1.2mm;padding:1.2mm 0 0.6mm;align-items:baseline}
.qn{font-variant-numeric:tabular-nums}
.qa{font-size:0.92em;padding-top:0.3mm}
.qa b{margin-right:1.2mm}
.qa-line{border-bottom:0.2mm solid #666;height:6.8mm}

@page{size:A4 portrait;margin:0}
@media print{
  html,body{height:auto;background:#fff!important}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important}
  #print-root .page{break-after:page;page-break-after:always;margin:0;box-shadow:none}
  #print-root .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="top-row">
      <span class="brand">단원 정리본 만들기</span>
      <div class="unit-pick">
        <label for="unit-select" class="sr-only">단원 고르기</label>
        <select id="unit-select"></select>
        <button type="button" class="btn" id="btn-new">새 단원</button>
        <button type="button" class="btn" id="btn-copy">복제</button>
        <button type="button" class="btn danger" id="btn-del">지우기</button>
      </div>
      <span class="spacer"></span>
      <button type="button" class="btn" id="btn-export">백업 파일 저장</button>
      <button type="button" class="btn" id="btn-import">백업 불러오기</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
      <span class="save-state" id="save-state" aria-live="polite"></span>
    </div>
    <div class="tabs" role="tablist" aria-label="정리본 종류" id="tabs"></div>
  </header>

  <div class="work">
    <section class="editor" id="editor" aria-label="내용 입력"></section>

    <section class="preview" aria-label="A4 미리보기">
      <div class="pv-bar">
        <div class="seg" role="radiogroup" aria-label="수준">
          <input type="radio" name="level" id="lv-basic" value="basic"><label for="lv-basic">기본형</label>
          <input type="radio" name="level" id="lv-adv" value="adv"><label for="lv-adv">심화형</label>
        </div>
        <div class="seg" role="radiogroup" aria-label="종류">
          <input type="radio" name="version" id="vs-summary" value="summary"><label for="vs-summary">정리본</label>
          <input type="radio" name="version" id="vs-blank" value="blank"><label for="vs-blank">빈칸본</label>
        </div>
        <span class="ctl"><label for="font-size">글자</label><select id="font-size"></select></span>
        <span class="ctl" id="cols-ctl"><label for="cols">배치</label>
          <select id="cols"><option value="1">1단</option><option value="2">2단</option></select></span>
        <button type="button" class="btn" id="btn-fit">1면에 맞추기</button>
        <span class="spacer"></span>
        <span class="pages-info" id="pages-info" aria-live="polite"></span>
        <button type="button" class="btn primary" id="btn-print">이 장 인쇄</button>
        <button type="button" class="btn" id="btn-print-all">여러 장 인쇄</button>
      </div>
      <div class="pv-opts">
        <details id="opts">
          <summary id="opts-summary">빈칸본 설정</summary>
          <div class="opt-grid">
            <span class="ctl"><label for="o-wordBlank">단어 빈칸</label>
              <select id="o-wordBlank"><option value="meaning">뜻 쓰기 (영어 보고)</option><option value="word">영어 쓰기 (뜻 보고)</option><option value="mixed">번갈아</option></select></span>
            <span class="ctl"><label for="o-trans">해석</label>
              <select id="o-trans"><option value="show">보여 주기</option><option value="hide">숨기기</option><option value="write">쓰기 칸</option></select></span>
            <span class="ctl"><input type="checkbox" id="o-bank"><label for="o-bank">보기 제공 (빈칸 답을 섞어서)</label></span>
            <span class="ctl"><input type="checkbox" id="o-hint"><label for="o-hint">첫 글자 힌트</label></span>
            <span class="ctl"><label for="o-levelLabel">인쇄물 수준 표시</label>
              <select id="o-levelLabel"><option value="kr">기본형 / 심화형</option><option value="ab">A형 / B형</option><option value="none">표시 안 함</option></select></span>
          </div>
          <p class="opt-note" id="opt-note"></p>
        </details>
      </div>
      <p class="print-tip">인쇄 창에서 용지 A4, 배율 기본(100%)으로 인쇄하세요. 회색 칸이 안 나오면 ‘배경 그래픽’을 켜세요. PDF로 저장하려면 대상을 ‘PDF로 저장’으로 고르세요.</p>
      <p class="pv-msg" id="pv-msg" aria-live="polite"></p>
      <div class="pages" id="pages"></div>
    </section>
  </div>
</div>

<div id="toast-slot" aria-live="polite"></div>

<dialog id="dlg-print" aria-labelledby="dlg-print-h">
  <form method="dialog">
    <h2 id="dlg-print-h">이 단원 여러 장 인쇄</h2>
    <fieldset id="pa-sheets"><legend>장</legend></fieldset>
    <fieldset><legend>수준</legend>
      <label><input type="checkbox" name="pa-level" value="basic" checked> 기본형</label>
      <label><input type="checkbox" name="pa-level" value="adv" checked> 심화형</label>
    </fieldset>
    <fieldset><legend>종류</legend>
      <label><input type="checkbox" name="pa-version" value="summary" checked> 정리본</label>
      <label><input type="checkbox" name="pa-version" value="blank" checked> 빈칸본</label>
    </fieldset>
    <label><input type="checkbox" id="pa-filler" checked> 양면 인쇄할 때: 1면짜리 장 뒤에 빈 면 넣기</label>
    <p id="pa-sum" aria-live="polite"></p>
    <div class="dlg-act">
      <button type="submit" class="btn" value="cancel">취소</button>
      <button type="submit" class="btn primary" value="go" id="pa-go">인쇄</button>
    </div>
  </form>
</dialog>

/* ---------- 저장 ---------- */
let store=null, storageOK=true, saveTimer=null, lastSaved=null, saveFailed=false;
const str=v=>typeof v==='string'?v:'';
function normLayout(l){
  const d=defaultLayout();
  if(l&&typeof l==='object') for(const k of Object.keys(d)){
    const x=l[k]||{};
    if(FONT_SIZES.includes(Number(x.fs))) d[k].fs=Number(x.fs);
    if(k==='words'&&(x.cols===1||x.cols===2)) d[k].cols=x.cols;
  }
  return d;
}
function normUnit(u){
  if(!u||typeof u!=='object') return null;
  const arr=a=>Array.isArray(a)?a:[];
  return {id:str(u.id)||uid(),name:str(u.name).trim()||'이름 없는 단원',sample:!!u.sample,updated:Number(u.updated)||Date.now(),
    words:{text:str(u.words&&u.words.text),checks:str(u.words&&u.words.checks)},
    dialogue:{functions:arr(u.dialogue&&u.dialogue.functions).map(f=>({name:str(f&&f.name),main:str(f&&f.main),alt:str(f&&f.alt),reply:str(f&&f.reply)})),
              dialogs:arr(u.dialogue&&u.dialogue.dialogs).map(g=>({title:str(g&&g.title),summary:str(g&&g.summary),lines:str(g&&g.lines)})),
              checks:str(u.dialogue&&u.dialogue.checks)},
    reading:{text:str(u.reading&&u.reading.text),checks:str(u.reading&&u.reading.checks)},
    grammar:{points:arr(u.grammar&&u.grammar.points).map(p=>({title:str(p&&p.title),form:str(p&&p.form),examples:str(p&&p.examples),notes:str(p&&p.notes),practice:str(p&&p.practice)}))},
    layout:normLayout(u.layout)};
}
function normSettings(s){
  const out={levels:JSON.parse(JSON.stringify(DEFAULT_LEVELS)),levelLabel:'kr'};
  if(s&&typeof s==='object'){
    for(const lv of ['basic','adv']){
      const x=s.levels&&s.levels[lv]; if(!x) continue;
      if(['meaning','word','mixed'].includes(x.wordBlank)) out.levels[lv].wordBlank=x.wordBlank;
      if(['show','hide','write'].includes(x.trans)) out.levels[lv].trans=x.trans;
      if(typeof x.bank==='boolean') out.levels[lv].bank=x.bank;
      if(typeof x.hint==='boolean') out.levels[lv].hint=x.hint;
    }
    if(LEVEL_LABELS[s.levelLabel]) out.levelLabel=s.levelLabel;
  }
  return out;
}
function loadStore(){
  let raw=null;
  try{ raw=localStorage.getItem(LS_KEY); }catch(e){ storageOK=false; }
  let st=null;
  try{ st=raw?JSON.parse(raw):null; }catch(e){ st=null; }
  const units=st&&Array.isArray(st.units)?st.units.map(normUnit).filter(Boolean):[];
  if(!units.length) units.push(sampleUnit());
  const ui=(st&&st.ui)||{};
  store={units,currentId:(st&&units.some(u=>u.id===st.currentId))?st.currentId:units[0].id,
    settings:normSettings(st&&st.settings),
    ui:{sheet:SHEET_NAME[ui.sheet]?ui.sheet:'words',level:ui.level==='adv'?'adv':'basic',version:ui.version==='blank'?'blank':'summary'}};
}
function saveNow(){
  saveTimer=null;
  try{
    localStorage.setItem(LS_KEY,JSON.stringify({app:APP_ID,version:1,units:store.units,currentId:store.currentId,settings:store.settings,ui:store.ui}));
    lastSaved=new Date(); saveFailed=false;
  }catch(e){ saveFailed=true; }
  showSaveState();
}
function scheduleSave(){ if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,400); }
function showSaveState(){
  const el=$('#save-state');
  if(!storageOK||saveFailed){ el.textContent='⚠ 이 브라우저에 저장할 수 없어요. 백업 파일로 저장해 주세요.'; el.classList.add('fail'); return; }
  el.classList.remove('fail');
  el.textContent=lastSaved?`자동 저장됨 · 이 브라우저 · ${String(lastSaved.getHours()).padStart(2,'0')}:${String(lastSaved.getMinutes()).padStart(2,'0')}`:'이 컴퓨터의 이 브라우저에 자동 저장돼요';
  el.title='단원 내용은 이 컴퓨터의 이 브라우저에만 저장됩니다. 새로고침해도 남지만, 다른 컴퓨터에서 쓰거나 브라우저 기록을 지울 때를 대비해 백업 파일을 저장해 두세요.';
}
const cur=()=>store.units.find(u=>u.id===store.currentId)||store.units[0];
function touched(){ cur().updated=Date.now(); scheduleSave(); }

/* ---------- 입력 해석 ---------- */
function parseMarks(s){
  const out=[]; const re=/\[\[([\s\S]*?)\]\]|\{\{([\s\S]*?)\}\}/g; let last=0,m;
  while((m=re.exec(s))){
    if(m.index>last) out.push({t:'text',s:s.slice(last,m.index)});
    if(m[1]!==undefined) out.push({t:'key',s:m[1],adv:false}); else out.push({t:'key',s:m[2],adv:true});
    last=re.lastIndex;
  }
  if(last<s.length) out.push({t:'text',s:s.slice(last)});
  return out;
}
function bracketIssue(s){
  const c=(re)=>(s.match(re)||[]).length;
  const issues=[];
  if(c(/\[\[/g)!==c(/\]\]/g)) issues.push('[[ ]]');
  if(c(/\{\{/g)!==c(/\}\}/g)) issues.push('{{ }}');
  return issues.length?`${issues.join(', ')} 짝이 맞지 않아요. 여는 괄호와 닫는 괄호를 확인해 주세요.`:'';
}
const POS_RE=/^$|^(n|v|a|adj|adv|prep|conj|pron|int|interj|phr|aux|vt|vi|art|det|num)\.?(\s*[\/,·;&]\s*(n|v|a|adj|adv|prep|conj|pron|int|interj|phr|aux|vt|vi|art|det|num)\.?)*$|^(명|동|형|부|전|접|대|감|구|숙|숙어|명사|동사|형용사|부사|전치사|접속사|대명사|감탄사)\.?$/i;
function splitCells(line){ return (line.includes('\t')?line.split('\t'):line.split('|')).map(x=>x.trim()); }
function stripPrefix(line,allowAdv,allowStar){
  let s=line.trim(),adv=false,star=false;
  for(;;){
    if(allowAdv&&s[0]==='+'){adv=true;s=s.slice(1).trimStart();continue;}
    if(allowStar&&s[0]==='*'){star=true;s=s.slice(1).trimStart();continue;}
    break;
  }
  return {adv,star,text:s};
}
function splitTr(s){ const k=s.search(/\t|\|/); return k<0?{en:s.trim(),tr:''}:{en:s.slice(0,k).trim(),tr:s.slice(k+1).replace(/^[\t|\s]+/,'').trim()}; }
function parseWords(text){
  const items=[],warns=[];
  text.split(/\r?\n/).forEach((raw,i)=>{
    const line=raw.trim(); if(!line) return;
    if(line.startsWith('#')){ items.push({type:'group',name:line.replace(/^#+\s*/,'')}); return; }
    const p=stripPrefix(line,true,true);
    const c=splitCells(p.text);
    let word=c[0]||'',pos='',mean='',rel='';
    if(c.length===2){ mean=c[1]; }
    else if(c.length===3){ if(POS_RE.test(c[1])){pos=c[1];mean=c[2];} else {mean=c[1];rel=c[2];} }
    else if(c.length>=4){ pos=c[1];mean=c[2];rel=c.slice(3).filter(Boolean).join(' / '); }
    if(!word) warns.push(`${i+1}번째 줄: 영어가 비어 있어요.`);
    else if(!mean) warns.push(`${i+1}번째 줄 ‘${word}’: 뜻이 없어요. 영어와 뜻 사이에 | 를 넣어 주세요.`);
    items.push({type:'word',word,pos,mean,rel,adv:p.adv,star:p.star});
  });
  return {items,warns};
}
function parseQs(text){
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    let adv=false; if(l[0]==='+'){adv=true;l=l.slice(1).trim();}
    const k=l.indexOf('=>');
    return k>=0?{q:l.slice(0,k).trim(),a:l.slice(k+2).trim(),adv}:{q:l,a:'',adv};
  }).filter(x=>x.q||x.a);
}
function parseLines(text){
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=stripPrefix(l,true,false); const t=splitTr(p.text); return {en:t.en,tr:t.tr,adv:p.adv};
  });
}
function parseReading(text){
  const paras=[]; let curP=null;
  text.split(/\r?\n/).forEach(raw=>{
    const l=raw.trim();
    if(!l){ curP=null; return; }
    if(l[0]==='@'){ curP={summary:l.replace(/^@\s*/,''),sents:[]}; paras.push(curP); return; }
    if(!curP){ curP={summary:'',sents:[]}; paras.push(curP); }
    const p=stripPrefix(l,false,true); const t=splitTr(p.text);
    curP.sents.push({en:t.en,tr:t.tr,star:p.star});
  });
  return {paras:paras.filter(p=>p.sents.length||p.summary)};
}
const SPK=/^([A-Za-zㄱ-힝][A-Za-zㄱ-힝 .'’-]{0,15}?)\s*[:：]\s*(.+)$/;
function parseDialog(text){
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const t=splitTr(l); const m=t.en.match(SPK);
    return m?{sp:m[1].trim(),text:m[2],tr:t.tr}:{sp:'',text:t.en,tr:t.tr};
  });
}

/* ---------- 출력 조각 ---------- */
function hashStr(s){ let h=2166136261; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function seeded(a){ return ()=>{ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffled(arr,seed){
  const r=seeded(hashStr(seed)||1); const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  if(a.length>1&&a.every((x,i)=>x===arr[i])) a.push(a.shift());
  return a;
}
function makeCtx(level,version,seed){ return {level,version,opt:store.settings.levels[level],n:0,answers:[],q:0,seed}; }
function blankHtml(ans,num,hint){
  const a=ans.trim();
  if(hint&&a){
    const parts=a.split(/\s+/).map(w=>{ const chars=Array.from(w); return esc(chars[0])+`<span class="ul" style="width:${(Math.max(1,chars.length-1)*0.62+0.5).toFixed(2)}em"></span>`; }).join(' ');
    return `<span class="blank"><span class="bn">${num}</span>${parts}</span>`;
  }
  const w=Math.min(22,Math.max(4,Array.from(a).length*0.62+1.8));
  return `<span class="blank"><span class="bn">${num}</span><span class="ul" style="width:${w.toFixed(2)}em"></span></span>`;
}
function inline(s,ctx){
  return parseMarks(s).map(tok=>{
    if(tok.t==='text') return esc(tok.s);
    if(tok.adv&&ctx.level==='basic') return esc(tok.s);
    const num=++ctx.n;
    if(ctx.version==='summary') return `<span class="key"><span class="bn">${num}</span>${esc(tok.s)}</span>`;
    ctx.answers.push(tok.s.trim());
    return blankHtml(tok.s,num,ctx.opt.hint);
  }).join('');
}
function bankHtml(ctx,from,seedKey){
  if(ctx.version!=='blank'||!ctx.opt.bank) return '';
  const seen=new Set(); const list=[];
  ctx.answers.slice(from).forEach(a=>{ const k=a.toLowerCase(); if(a&&!seen.has(k)){ seen.add(k); list.push(a); } });
  if(!list.length) return '';
  return `<div class="bank"><b>보기</b>${shuffled(list,ctx.seed+seedKey).map(esc).join('<span class="sep">·</span>')}</div>`;
}
function trHtml(tr,ctx){
  if(ctx.version==='summary') return tr?`<div class="tr">${esc(tr)}</div>`:'';
  if(ctx.opt.trans==='write') return '<div class="tr write"></div>';
  if(ctx.opt.trans==='show'&&tr) return `<div class="tr">${esc(tr)}</div>`;
  return '';
}
function glossHtml(tr,ctx){
  if(!tr) return '';
  if(ctx.version==='blank'&&ctx.opt.trans!=='show') return '';
  return `<span class="gloss">${esc(tr)}</span>`;
}
function checksBlocks(text,ctx,title){
  const qs=parseQs(text).filter(q=>!(q.adv&&ctx.level==='basic'));
  if(!qs.length) return [];
  const out=[{html:`<div class="q-head">${esc(title||'확인 문제')}</div>`,keep:true}];
  qs.forEach(q=>{
    const n=++ctx.q;
    const ans=ctx.version==='summary'?(q.a?`<div class="qa"><b>정답</b>${esc(q.a)}</div>`:''):'<div class="qa-line"></div>';
    out.push({html:`<div class="q"><span class="qn">${n}.</span><div><div class="qt">${esc(q.q)}</div>${ans}</div></div>`});
  });
  return out;
}
function hintWord(w){
  const chars=Array.from(w.trim()); if(!chars.length) return '';
  return w.trim().split(/\s+/).map(x=>{ const c=Array.from(x); return esc(c[0])+`<span class="ul" style="width:${(Math.max(1,c.length-1)*0.62+0.5).toFixed(2)}em"></span>`; }).join(' ');
}

/* ---------- 장 만들기 ---------- */
function buildWords(u,ctx){
  const {items}=parseWords(u.words.text);
  const act=items.filter(it=>it.type==='group'||!(it.adv&&ctx.level==='basic'));
  const list=act.filter((it,i)=>it.type!=='group'||(act[i+1]&&act[i+1].type==='word'));
  const words=list.filter(it=>it.type==='word');
  const hasPos=words.some(w=>w.pos);
  const rc='w-row'+(hasPos?' has-pos':'');
  const blocks=[]; let n=0;
  list.forEach(it=>{
    if(it.type==='group'){ blocks.push({html:`<div class="w-group">${esc(it.name)}</div>`,keep:true}); return; }
    n++;
    let mode=ctx.version==='summary'?'none':ctx.opt.wordBlank;
    if(mode==='mixed') mode=n%2?'meaning':'word';
    const star=it.star?'<span class="star" title="중요">★</span>':'';
    const wc=mode==='word'?`<span class="w-word">${star}${ctx.opt.hint?hintWord(it.word):''}</span>`:`<span class="w-word">${star}${esc(it.word)}</span>`;
    const mc=mode==='meaning'?'<span class="w-mean"></span>':`<span class="w-mean">${esc(it.mean)}</span>`;
    const relActive=it.rel&&parseMarks(it.rel).some(t=>t.t==='key'&&!(t.adv&&ctx.level==='basic'));
    const showRel=it.rel&&(ctx.version==='summary'||relActive);
    const rel=showRel?`<span class="w-rel">${/^[=→]/.test(it.rel)?'':'→ '}${inline(it.rel,ctx)}</span>`:'';
    blocks.push({html:`<div class="${rc}"><span class="w-no">${n}</span>${wc}${hasPos?`<span class="w-pos">${esc(it.pos)}</span>`:''}${mc}${rel}</div>`});
  });
  blocks.push(...checksBlocks(u.words.checks,ctx));
  const colHead=words.length?`<div class="${rc} w-head"><span>번호</span><span>영어</span>${hasPos?'<span>품사</span>':''}<span>뜻</span></div>`:'';
  let instr;
  if(ctx.version==='summary') instr='뜻을 가리고 영어를, 영어를 가리고 뜻을 떠올려 보세요. ★는 꼭 외울 단어예요.';
  else instr={meaning:'영어를 보고 우리말 뜻을 쓰세요.',word:'우리말 뜻을 보고 영어 철자를 쓰세요.',mixed:'비어 있는 칸에 영어 또는 우리말 뜻을 쓰세요.'}[ctx.opt.wordBlank];
  return {blocks,colHead,cols:u.layout.words.cols,instr,count:words.length};
}
function buildDialogue(u,ctx){
  const blocks=[];
  const fns=u.dialogue.functions.filter(f=>f.name.trim()||f.main.trim()||f.alt.trim()||f.reply.trim());
  if(fns.length){
    blocks.push({html:'<div class="sec-h">의사소통 기능</div>',keep:true});
    fns.forEach((f,fi)=>{
      const from=ctx.answers.length;
      const row=(label,text)=>{
        const ls=parseLines(text).filter(l=>!(l.adv&&ctx.level==='basic'));
        if(!ls.length) return '';
        return `<div class="fn-row"><span class="fn-label">${label}</span><div>${ls.map(l=>`<div class="fn-line">${inline(l.en,ctx)}${glossHtml(l.tr,ctx)}</div>`).join('')}</div></div>`;
      };
      const body=row('핵심 표현',f.main)+row('같은 뜻',f.alt)+row('대답·관련',f.reply);
      blocks.push({html:`<div class="fn-box"><div class="fn-name">${esc(f.name||'의사소통 기능')}</div>${body}${bankHtml(ctx,from,'fn'+fi)}</div>`,gap:false});
    });
  }
  const dls=u.dialogue.dialogs.filter(d=>d.title.trim()||d.lines.trim());
  if(dls.length){
    blocks.push({html:'<div class="sec-h" style="margin-top:2mm">대화문</div>',keep:true});
    dls.forEach((d,di)=>{
      const from=ctx.answers.length;
      const lines=parseDialog(d.lines).map(l=>({html:`<div class="dl-line"><span class="dl-sp">${esc(l.sp)}</span><div><div class="dl-text">${inline(l.text,ctx)}</div>${trHtml(l.tr,ctx)}</div></div>`}));
      blocks.push({html:`<div class="dl-title">${esc(d.title||'대화 '+(di+1))}</div>${d.summary.trim()?`<div class="dl-sum">흐름: ${esc(d.summary)}</div>`:''}${bankHtml(ctx,from,'dl'+di)}`,keep:true});
      blocks.push(...lines);
    });
  }
  blocks.push(...checksBlocks(u.dialogue.checks,ctx));
  const instr=ctx.version==='summary'
    ?'굵은 밑줄 표현은 빈칸본에서 빈칸이 되는 곳이에요. 작은 번호로 빈칸본의 답을 맞춰 보세요.'
    :'대화의 흐름에 맞게 빈칸을 채우세요.'+(ctx.opt.bank?' 보기에서 골라 써도 돼요.':'');
  return {blocks,colHead:'',cols:1,instr,count:dls.length};
}
function buildReading(u,ctx){
  const blocks=[]; const {paras}=parseReading(u.reading.text); let sn=0;
  paras.forEach((p,pi)=>{
    const from=ctx.answers.length;
    const sents=p.sents.map(s=>{ sn++; return {html:`<div class="sent${s.star?' key-sent':''}"><span class="s-no">${sn}</span><div><div class="en">${s.star?'<span class="star" title="핵심 문장">★</span>':''}${inline(s.en,ctx)}</div>${trHtml(s.tr,ctx)}</div></div>`}; });
    blocks.push({html:`<div class="p-head"><span class="p-no">${pi+1}문단</span>${esc(p.summary)}</div>${bankHtml(ctx,from,'p'+pi)}`,keep:true});
    blocks.push(...sents);
  });
  blocks.push(...checksBlocks(u.reading.checks,ctx));
  const instr=ctx.version==='summary'
    ?'★ 문장은 서술형에 자주 나오는 핵심 문장이에요. 굵은 밑줄 표현은 빈칸본에서 빈칸이 되고, 작은 번호가 같아요.'
    :'본문 흐름을 떠올리며 빈칸을 채우세요.'+(ctx.opt.bank?' 보기는 문단마다 있어요.':'');
  return {blocks,colHead:'',cols:1,instr,count:sn};
}
function buildGrammar(u,ctx){
  const blocks=[];
  const pts=u.grammar.points.filter(p=>p.title.trim()||p.form.trim()||p.examples.trim()||p.notes.trim()||p.practice.trim());
  pts.forEach((p,pi)=>{
    const from=ctx.answers.length;
    const form=parseLines(p.form).filter(l=>!(l.adv&&ctx.level==='basic'));
    const formHtml=form.length?`<div class="g-form">${form.map(l=>`<div class="g-line">${inline(l.en,ctx)}${glossHtml(l.tr,ctx)}</div>`).join('')}</div>`:'';
    const ex=parseLines(p.examples).filter(l=>!(l.adv&&ctx.level==='basic'));
    const exHtml=ex.length?`<div class="g-label">예문</div>${ex.map(l=>`<div class="g-ex"><div class="en">${inline(l.en,ctx)}</div>${trHtml(l.tr,ctx)}</div>`).join('')}`:'';
    const nt=parseLines(p.notes).filter(l=>!(l.adv&&ctx.level==='basic'));
    const ntHtml=nt.length?`<div class="g-label">주의할 점</div>${nt.map(l=>`<div class="g-note">※ ${inline(l.en,ctx)}${l.tr?` <span class="gloss">${esc(l.tr)}</span>`:''}</div>`).join('')}`:'';
    const bank=bankHtml(ctx,from,'g'+pi);
    blocks.push({html:`<div class="g-head"><span class="g-no">문법 ${pi+1}</span><span class="g-title">${esc(p.title||'문법')}</span></div>${formHtml}${bank}`,keep:true});
    if(exHtml) blocks.push({html:exHtml});
    if(ntHtml) blocks.push({html:ntHtml});
    blocks.push(...checksBlocks(p.practice,ctx,'연습 문제'));
    blocks.push({html:'<div style="height:1.5mm"></div>'});
  });
  const instr=ctx.version==='summary'
    ?'형태 → 예문 → 주의할 점 순서로 읽고, 연습 문제로 확인하세요. 작은 번호는 빈칸본의 빈칸 번호예요.'
    :'규칙과 예문의 빈칸을 채운 뒤 연습 문제를 풀어 보세요.';
  return {blocks,colHead:'',cols:1,instr,count:pts.length};
}
const BUILDERS={words:buildWords,dialogue:buildDialogue,reading:buildReading,grammar:buildGrammar};

function buildSheet(u,sheet,level,version){
  const ctx=makeCtx(level,version,u.id+sheet+level);
  const sh=BUILDERS[sheet](u,ctx);
  const lvl=LEVEL_LABELS[store.settings.levelLabel][level];
  const tag=[lvl,VERSION_LABEL[version]].filter(Boolean).join(' · ');
  const title=`${SHEET_NAME[sheet]} ${version==='summary'?'정리':'빈칸 채우기'}`;
  const rounds=version==='summary'?'<span class="ph-rounds">공부한 날 ☐ ____ ☐ ____ ☐ ____</span>':'';
  sh.first=`<div class="ph-wrap"><div class="ph"><div><div class="ph-unit">${esc(u.name)}</div><div class="ph-title">${esc(title)}</div></div><div class="ph-side"><span class="ph-tag">${esc(tag)}</span><span class="ph-name">이름<span></span></span></div></div><div class="ph-instr"><span>${esc(sh.instr)}</span>${rounds}</div></div>`;
  sh.cont=`<div class="ph-cont"><span>${esc(u.name)} · ${esc(title)} (계속)</span><span>${esc(tag)}</span></div>`;
  sh.foot=tag;
  sh.vclass=version==='blank'?'v-blank':'v-summary';
  sh.empty=!sh.blocks.length;
  return sh;
}

/* ---------- 면 나누기 ---------- */
function paginate(sh,fs){
  const M=$('#measure');
  const fullW=PAGE.w-2*PAGE.m;
  const colW=sh.cols===2?(fullW-PAGE.gap)/2:fullW;
  M.innerHTML=`<div class="sheet ${sh.vclass}" style="--fs:${fs}pt"><div style="width:${fullW}mm">${sh.first}</div><div style="width:${fullW}mm">${sh.cont}</div><div style="width:${colW}mm">${sh.colHead||''}</div><div style="width:${colW}mm">${sh.blocks.map(b=>`<div class="blk${b.gap?' gap':''}">${b.html}</div>`).join('')}</div></div>`;
  const k=M.firstElementChild.children;
  const H=el=>el.getBoundingClientRect().height;
  const hFirst=H(k[0]),hCont=H(k[1]),hHead=H(k[2]);
  const bh=Array.from(k[3].children).map(H);
  M.innerHTML='';
  const contentH=(PAGE.h-2*PAGE.m)*PX_MM-2;
  const pages=[]; let page,col,rem,overflow=false;
  const colStart=()=>contentH-(page.first?hFirst:hCont)-hHead;
  const newPage=()=>{ page={first:!pages.length,cols:Array.from({length:sh.cols},()=>[])}; pages.push(page); col=0; rem=colStart(); };
  const nextCol=()=>{ if(col<sh.cols-1){ col++; rem=colStart(); } else newPage(); };
  newPage();
  for(let i=0;i<sh.blocks.length;i++){
    const h=bh[i];
    let need=h; if(sh.blocks[i].keep&&i+1<sh.blocks.length) need+=bh[i+1];
    if(need>rem+0.5&&page.cols[col].length) nextCol();
    page.cols[col].push(i); rem-=h;
    if(rem<-1) overflow=true;
  }
  /* 2단: 마지막 면은 두 단의 길이를 비슷하게 나눔 */
  const last=pages[pages.length-1];
  if(sh.cols===2&&!overflow){
    const idx=last.cols[0].concat(last.cols[1]);
    if(idx.length>1){
      const cap=(last.first?contentH-hFirst:contentH-hCont)-hHead;
      const total=idx.reduce((a,i)=>a+bh[i],0);
      let best=null, h1=0;
      for(let k=1;k<idx.length;k++){
        h1+=bh[idx[k-1]];
        if(sh.blocks[idx[k-1]].keep) continue;
        const h2=total-h1;
        if(h1>cap+0.5||h2>cap+0.5) continue;
        const score=Math.max(h1,h2);
        if(!best||score<best.score) best={k,score};
      }
      if(best){ last.cols=[idx.slice(0,best.k),idx.slice(best.k)]; }
    }
  }
  return {pages,overflow};
}
function pagesHtml(sh,pg,fs){
  const total=pg.pages.length;
  return pg.pages.map((p,pi)=>`<div class="page sheet ${sh.vclass}" style="--fs:${fs}pt">${p.first?sh.first:sh.cont}<div class="cols${sh.cols===2?' c2':''}">${p.cols.map(c=>`<div class="col">${c.length||pi===0?(sh.colHead||''):''}${c.map(i=>`<div class="blk${sh.blocks[i].gap?' gap':''}">${sh.blocks[i].html}</div>`).join('')}</div>`).join('')}</div><div class="pfoot">${esc(sh.foot)} · ${pi+1} / ${total}</div></div>`);
}
const blankPage=()=>'<div class="page sheet"></div>';
function compose(u,sheet,level,version,fsOverride){
  const sh=buildSheet(u,sheet,level,version);
  const fs=fsOverride||u.layout[sheet].fs;
  const pg=paginate(sh,fs);
  return {sh,pg,fs,html:pagesHtml(sh,pg,fs)};
}

/* ---------- 화면: 입력 ---------- */
function fieldHtml(path,label,val,rows,help,ph){

function cardHtml(kind,i,len,title,inner){

}
const RULES=`<details class="rules"><summary>입력 규칙 보기</summary><table>
<tr><td><code>[[ ]]</code></td><td>빈칸이 될 말. 기본형·심화형 빈칸본 모두 빈칸, 정리본에서는 굵은 밑줄<br>예: I [[can’t wait to]] go.</td></tr>
<tr><td><code>{{ }}</code></td><td>심화형에서만 빈칸. 기본형에서는 그냥 글자로 나와요</td></tr>
<tr><td><code>|</code></td><td>칸 나누기 (영어 | 뜻, 문장 | 해석). 엑셀에서 붙여 넣은 탭도 돼요</td></tr>

function getPath(obj,path){ return path.split('.').reduce((o,k)=>o==null?o:o[/^\d+$/.test(k)?+k:k],obj); }
function setPath(obj,path,val){ const ks=path.split('.'); let o=obj; for(let i=0;i<ks.length-1;i++) o=o[/^\d+$/.test(ks[i])?+ks[i]:ks[i]]; o[ks[ks.length-1]]=val; }
function updateLive(path){
  const el=$(`[data-live="${CSS.escape(path)}"]`); if(!el) return;
  const val=getPath(cur(),path)||'';
  const ok=[],warn=[];
  const b=bracketIssue(val); if(b) warn.push(b);
  if(path==='words.text'){
    const r=parseWords(val); const w=r.items.filter(x=>x.type==='word');
    if(w.length) ok.push(`단어 ${w.length}개 · ★ ${w.filter(x=>x.star).length}개 · 심화형에만 ${w.filter(x=>x.adv).length}개`);
    r.warns.slice(0,4).forEach(x=>warn.push(x)); if(r.warns.length>4) warn.push(`그 밖에 ${r.warns.length-4}줄 더 확인해 주세요.`);
  }else if(/checks$|practice$/.test(path)){
    const q=parseQs(val); if(q.length){ const no=q.filter(x=>!x.a).length; ok.push(`문제 ${q.length}개${q.filter(x=>x.adv).length?` (심화형에만 ${q.filter(x=>x.adv).length}개)`:''}`); if(no) warn.push(`정답(=> 뒤)이 없는 문제 ${no}개: 정리본에 정답이 나오지 않아요.`); }
  }else if(path==='reading.text'){
    const {paras}=parseReading(val); const all=paras.flatMap(p=>p.sents);
    if(all.length){ ok.push(`문단 ${paras.length}개 · 문장 ${all.length}개 · ★ ${all.filter(x=>x.star).length}개`); const no=all.filter(x=>!x.tr).length; if(no) warn.push(`해석이 없는 문장 ${no}개 (해석 칸이 비어서 나와요)`); }
  }else if(/\.lines$/.test(path)){
    const ls=parseDialog(val); if(ls.length){ ok.push(`대사 ${ls.length}줄`); const ns=ls.filter(x=>!x.sp).length; if(ns) warn.push(`말한 사람(이름:)이 없는 줄 ${ns}개`); }
  }
  el.innerHTML=ok.map(t=>`<span class="ok">✓ ${esc(t)}</span>`).join(' ')+warn.map(t=>`<span class="warn">⚠ 확인: ${esc(t)}</span>`).join('');
}

/* ---------- 화면: 미리보기 ---------- */
let renderTimer=null, lastCompose=null;
function scheduleRender(){ if(renderTimer) clearTimeout(renderTimer); renderTimer=setTimeout(renderPreview,220); }
function renderPreview(){
  renderTimer=null;
  const u=cur(), ui=store.ui;
  const c=compose(u,ui.sheet,ui.level,ui.version);
  lastCompose=c;
  const area=$('#pages');
  const avail=Math.max(200,area.clientWidth-32);
  const pw=PAGE.w*PX_MM, ph=PAGE.h*PX_MM;
  const s=Math.min(1,avail/pw);
  const n=c.html.length;
  area.innerHTML=c.html.map((h,i)=>`<figure class="pv-fig"><figcaption>${i===0?'1면 (앞면)':i===1?'2면 (뒷면)':`${i+1}면`}</figcaption><div class="pv-frame" style="width:${(pw*s).toFixed(1)}px;height:${(ph*s).toFixed(1)}px"><div class="pv-scale" style="transform:scale(${s.toFixed(4)})">${h}</div>${c.sh.empty&&i===0?`<div class="pv-empty">왼쪽에 ${SHEET_NAME[ui.sheet]} 내용을 넣으면 여기에 나와요.</div>`:''}</div></figure>`).join('');
  const info=$('#pages-info');
  info.classList.toggle('warn',n>2||c.pg.overflow);
  if(c.sh.empty) info.textContent='내용 없음';
  else if(n===1) info.textContent='1면 · 단면 1장';
  else if(n===2) info.textContent='2면 · 양면 1장';
  else info.textContent=`⚠ ${n}면 · A4 한 장(양면)을 넘어요`;
  let msg='';
  if(n>2&&!c.sh.empty) msg=`이 장은 ${n}면이에요. 글자를 줄이거나(‘1면에 맞추기’), 내용을 나눠 주세요. 그대로 인쇄하면 ${Math.ceil(n/2)}장이 나와요.`;
  if(c.pg.overflow) msg+=(msg?' ':'')+'한 덩어리가 한 면보다 길어서 아래가 잘렸어요. 그 부분을 나눠 주세요.';
  $('#pv-msg').textContent=msg;
}

/* ---------- 인쇄 ---------- */
let printing=false;
function printHtml(pages){
  if(printing) return;
  printing=true;
  $('#print-root').innerHTML=pages.join('');
  setTimeout(()=>{ try{ window.print(); } finally { printing=false; } },60);
}
window.addEventListener('beforeprint',()=>{
  const root=$('#print-root');
  if(!root.innerHTML.trim()){ const c=compose(cur(),store.ui.sheet,store.ui.level,store.ui.version); root.innerHTML=c.html.join(''); }
});
window.addEventListener('afterprint',()=>{ $('#print-root').innerHTML=''; printing=false; });
function printAllList(){
  const sheets=$$('input[name="pa-sheet"]:checked').map(x=>x.value);
  const levels=$$('input[name="pa-level"]:checked').map(x=>x.value);
  const versions=$$('input[name="pa-version"]:checked').map(x=>x.value);
  const filler=$('#pa-filler').checked;
  const u=cur(); const pages=[]; let docs=0,blank=0,skipped=0,big=0;
  levels.forEach(lv=>versions.forEach(vs=>sheets.forEach(sh=>{
    const c=compose(u,sh,lv,vs);
    if(c.sh.empty){ skipped++; return; }
    docs++; if(c.html.length>2) big++;
    pages.push(...c.html);
    if(filler&&c.html.length%2===1){ pages.push(blankPage()); blank++; }
  })));
  return {pages,docs,blank,skipped,big};
}
function updatePrintSum(){
  const r=printAllList();
  let t=r.docs?`${r.docs}장 · 모두 ${r.pages.length}면${r.blank?` (빈 면 ${r.blank}개 포함)`:''}`:'고른 장에 인쇄할 내용이 없어요.';
  if(r.skipped) t+=` · 내용이 없는 ${r.skipped}개는 빼요.`;
  if(r.big) t+=` · ⚠ 한 장을 넘는 장이 ${r.big}개 있어요.`;
  $('#pa-sum').textContent=t;
  $('#pa-go').disabled=!r.docs;
}

/* ---------- 알림 ---------- */
let toastTimer=null;
function toast(msg,actionLabel,action){
  const slot=$('#toast-slot');
  slot.innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${actionLabel?`<button type="button" id="toast-act">${esc(actionLabel)}</button>`:''}</div>`;
  if(actionLabel) $('#toast-act').addEventListener('click',()=>{ slot.innerHTML=''; action(); });
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ slot.innerHTML=''; },actionLabel?7000:3500);
}

      if(!units.length){ toast('불러올 단원이 없어요.'); return; }
      const ids=new Set(store.units.map(u=>u.id));
      units.forEach(u=>{ if(ids.has(u.id)){ u.id=uid(); u.name+=' (불러옴)'; } ids.add(u.id); store.units.push(u); });
      store.currentId=units[0].id; scheduleSave(); renderAll();
      toast(`단원 ${units.length}개를 불러왔어요. 같은 단원이 이미 있으면 ‘(불러옴)’을 붙여 따로 넣었어요.`);
    };
    rd.onerror=()=>toast('파일을 읽는 중에 문제가 생겼어요. 다시 시도해 주세요.');
    rd.readAsText(f);
  });
  if('ResizeObserver' in window){ let w=0; new ResizeObserver(en=>{ const nw=Math.round(en[0].contentRect.width); if(Math.abs(nw-w)>4){ w=nw; scheduleRender(); } }).observe($('#pages')); }
  window.addEventListener('pagehide',()=>{ if(saveTimer){ clearTimeout(saveTimer); saveNow(); } });
}
function selectSheet(id){ store.ui.sheet=id; scheduleSave(); renderTabs(); syncToolbar(); renderEditor(); renderPreview(); }

/* ---------- 시작 ---------- */
loadStore();
bind();
renderAll();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>renderPreview());
window.__unitSheets={get store(){return store;},compose,parseWords,parseReading,parseDialog,parseQs,sampleUnit,printAllList};
})();
</script>
</body>
